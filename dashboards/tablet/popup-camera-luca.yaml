# GENERATO da genera-stanze.py: popup della stanza "Camera Luca".
# Non modificare qui: cambia la tabella STANZE e rilancia lo script.
type: custom:layout-card
layout_type: custom:grid-layout
layout:
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
  grid-gap: 20px
  margin: '0'
  padding: 0 4px 8px
cards:
- type: vertical-stack
  cards:
  - type: custom:button-card
    template: sezione
    entity: light.nspanel_luca_relay_1
    triggers_update:
    - light.luci_luca
    - light.razzonotteluca
    variables:
      titolo: Luci
      nota: |-
        [[[
          var L = ['light.nspanel_luca_relay_1', 'light.luci_luca', 'light.razzonotteluca'];
          var n = 0;
          for (var i = 0; i < L.length; i++) if (states[L[i]] && states[L[i]].state === 'on') n++;
          return n === 0 ? 'tutto spento' : (n === 1 ? '1 accesa' : n + ' accese');
        ]]]
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:button-card
      template: luce_riga
      entity: light.nspanel_luca_relay_1
      variables:
        nome: Corrente
        icona: mdi:power-plug-outline
    - type: custom:button-card
      template: luce_riga
      entity: light.luci_luca
      variables:
        nome: Lampadine
        icona: mdi:lightbulb-group-outline
        alimDa: light.nspanel_luca_relay_1
    - type: custom:button-card
      template: luce_riga
      entity: light.razzonotteluca
      variables:
        nome: Razzo notte
        icona: mdi:rocket-launch-outline
- type: vertical-stack
  cards:
  - type: custom:button-card
    template: sezione
    variables:
      titolo: Clima
  - type: custom:button-card
    template: clima_quadrante
    entity: climate.condizionatore_luca
    variables:
      sonde:
      - sensor.aqaracameraluca_temperature
      - sensor.nspanel_luca_temperature
      modi: true
    styles:
      card:
      - height: 372px
  - type: custom:button-card
    template: sezione
    variables:
      titolo: Ambiente
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:button-card
      template: dato_stanza
      entity: sensor.aqaracameraluca_temperature
      variables:
        nome: Temperatura
        tipo: temperatura
    - type: custom:button-card
      template: dato_stanza
      entity: sensor.aqaracameraluca_humidity
      variables:
        nome: Umidità
        tipo: umidita
    - type: custom:button-card
      template: dato_stanza
      entity: binary_sensor.balconeluca_contact
      variables:
        nome: Balcone
        tipo: apertura
    - type: custom:button-card
      template: dato_stanza
      entity: sensor.nspanel_luca_temperature
      variables:
        nome: NSPanel
        tipo: temperatura
    - type: custom:button-card
      template: dato_stanza
      entity: sensor.aqaracameraluca_battery
      variables:
        nome: Batteria sonda
        tipo: batteria
    - type: custom:button-card
      template: dato_stanza
      entity: sensor.telecomandocameraluca_battery
      variables:
        nome: Batteria telecomando
        tipo: batteria
