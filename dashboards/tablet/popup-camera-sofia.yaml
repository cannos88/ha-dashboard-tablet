# GENERATO da genera-stanze.py: popup della stanza "Camera Sofia".
# Non modificare qui: cambia la tabella STANZE e rilancia lo script.
type: custom:layout-card
layout_type: custom:grid-layout
layout:
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
  grid-gap: 20px
  margin: '0'
  padding: 0 4px 8px
cards:
- type: vertical-stack
  cards:
  - type: custom:button-card
    template: sezione
    entity: light.luce_sofia
    triggers_update:
    - light.lucinottesofia_l1
    - light.lucinottesofia_l2
    variables:
      titolo: Luci
      nota: |-
        [[[
          var L = ['light.luce_sofia', 'light.lucinottesofia_l1', 'light.lucinottesofia_l2'];
          var n = 0;
          for (var i = 0; i < L.length; i++) if (states[L[i]] && states[L[i]].state === 'on') n++;
          return n === 0 ? 'tutto spento' : (n === 1 ? '1 accesa' : n + ' accese');
        ]]]
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:button-card
      template: luce_riga
      entity: light.luce_sofia
      variables:
        nome: Luce principale
        icona: mdi:ceiling-light-outline
    - type: custom:button-card
      template: luce_riga
      entity: light.lucinottesofia_l1
      variables:
        nome: Luna
        icona: mdi:moon-waning-crescent
    - type: custom:button-card
      template: luce_riga
      entity: light.lucinottesofia_l2
      variables:
        nome: Nuvola
        icona: mdi:cloud-outline
- type: vertical-stack
  cards:
  - type: custom:button-card
    template: sezione
    variables:
      titolo: Clima
  - type: custom:button-card
    template: clima_quadrante
    entity: climate.condizionatore_sofia
    variables:
      sonde:
      - sensor.aqarasofia_temperature
      modi: true
    styles:
      card:
      - height: 372px
  - type: custom:button-card
    template: sezione
    variables:
      titolo: Ambiente
  - type: grid
    columns: 2
    square: false
    cards:
    - type: custom:button-card
      template: dato_stanza
      entity: sensor.aqarasofia_temperature
      variables:
        nome: Temperatura
        tipo: temperatura
    - type: custom:button-card
      template: dato_stanza
      entity: sensor.aqarasofia_humidity
      variables:
        nome: Umidità
        tipo: umidita
    - type: custom:button-card
      template: dato_stanza
      entity: binary_sensor.espkyogate_persiana_sofia
      variables:
        nome: Persiana
        tipo: apertura
    - type: custom:button-card
      template: dato_stanza
      entity: sensor.aqarasofia_battery
      variables:
        nome: Batteria sonda
        tipo: batteria
    - type: custom:button-card
      template: dato_stanza
      entity: sensor.tastilucinottesofia_battery
      variables:
        nome: Batteria tasti
        tipo: batteria
