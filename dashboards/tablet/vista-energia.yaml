                      }
                    </style>

                    <!-- Ombre perimetrali realistiche -->
                    <filter id="chassisShadow" x="-5%" y="-5%" width="110%" height="120%">
                      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
                    </filter>

                    <filter id="innerDepth">
                      <feOffset dx="0" dy="3"/>
                      <feGaussianBlur stdDeviation="4" result="offset-blur"/>
                      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
                      <feFlood flood-color="#000" flood-opacity="0.6" result="color"/>
                      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
                      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
                    </filter>

                    <!-- Gradienti scocca e finiture metallizzate -->
                    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="80%">
                      <stop offset="0%" stop-color="#ffffff"/>
                      <stop offset="25%" stop-color="#f1f5f9"/>
