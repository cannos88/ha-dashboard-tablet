                      /* Rotazione girante del circolatore */
                      @keyframes spinPump {
                        0% { transform: rotate(0deg); }
                        100% { transform: rotate(360deg); }
                      }
                      .pump-impeller {
                        ${scorre ? "animation: spinPump 0.8s linear infinite;" : ""}
                        transform-origin: 422px 282px;
                      }

                      /* Scorrimento del flusso idraulico a trattini */
                      @keyframes flowMotion {
                        from { stroke-dashoffset: 16; }
                        to { stroke-dashoffset: 0; }
                      }
                      .water-flow {
                        stroke-dasharray: 4 4;
                        ${scorre ? "animation: flowMotion 0.6s linear infinite;" : ""}
                      }
                      @media (prefers-reduced-motion: reduce) {
                        .rotating-blades, .pump-impeller, .water-flow {
                          animation: none !important;
