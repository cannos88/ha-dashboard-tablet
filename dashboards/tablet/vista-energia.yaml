                    <!-- Tubazione stilizzata con scorrimento fluido animato -->
                    <line x1="12" y1="30" x2="108" y2="30" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
                    <line x1="12" y1="30" x2="108" y2="30" stroke="${cFlusso}" stroke-width="2.5" stroke-linecap="round" class="water-flow" opacity="0.85"/>

                    <!-- Corpo del circolatore idraulico (centrato a X=17, Y=30 relativo = coord assolute X=422, Y=282) -->
                    <circle cx="17" cy="30" r="13" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
                    <circle cx="17" cy="30" r="10" fill="#1e293b"/>

                    <!-- Girante / Impeller rotante interna animata -->
                    <g class="pump-impeller">
                      <path d="M 422 282 L 422 274 M 422 282 L 422 290 M 422 282 L 414 282 M 422 282 L 430 282" stroke="${cFlusso}" stroke-width="2" stroke-linecap="round"/>
                      <circle cx="422" cy="282" r="2.5" fill="#ffffff"/>
                    </g>

                    <!-- Etichette di stato pompe e direzione flusso -->
                    <text x="36" y="20" fill="#94a3b8" font-size="10" class="subtext">CIRCOLATORE</text>
                    <text x="36" y="45" fill="${cFlusso}" font-size="11" font-family="monospace" font-weight="bold">${statoPompa}</text>

                    <!-- Freccia di direzione flusso idrico -->
                    <polygon points="102,27 108,30 102,33" fill="${cFlusso}"/>
                  </g>

                  <!-- Indicatori di stato / Simboli idraulici inferiori -->
                  <g transform="translate(405, 318)">
                    <!-- Stato Circolatore PWM -->
                    <g transform="translate(14, 0)">
                      <circle cx="15" cy="8" r="3" fill="${cPdc}" ${alonePdc}/>
                      <text x="15" y="24" fill="${cPdc}" font-size="9.5" text-anchor="middle" font-family="sans-serif" font-weight="700">${statoPdc}</text>
                    </g>

                    <!-- Icona Bus / Segnale -->
                    <g transform="translate(76, 0)">
                      <circle cx="15" cy="8" r="3" fill="#38bdf8"/>
                      <text x="15" y="24" fill="#7dd3fc" font-size="9.5" text-anchor="middle" font-family="sans-serif" font-weight="700">${tDelta}</text>
                    </g>
                  </g>
                </svg>
                `;

                return '<div style="width:100%;">' + disegno
                  + '<div style="display:flex;gap:8px;margin-top:6px;">' + riga + '</div>'
                  + '</div>';
              ]]]

        # ---------------- ACQUA CALDA SANITARIA ----------------
        # Puffer disegnato nello stile della pompa di calore accanto: finestra
        # con la stratificazione colorata dalle quattro sonde, collettore solare
        # collegato alla serpentina (mandata calda, ritorno freddo con il
        # circolatore), tubi e girante animati quando il circolatore gira,
        # display a LED per pannelli, circolatore e sonde, e il salto
        # pannelli-fondo che spiega perche' il circolatore e' fermo.
        - type: custom:button-card
          template: tessera
          entity: sensor.centrale_termica_temperatura_puffer_alto
          tap_action:
            action: fire-dom-event
            browser_mod:
              service: browser_mod.popup
              data:
                style: "--popup-background-color: #0E1116; --popup-border-radius: 28px; --mdc-theme-surface: #0E1116; --primary-background-color: #0E1116; --ha-font-family-body: 'Plus Jakarta Sans', system-ui, sans-serif; --mdc-typography-font-family: 'Plus Jakarta Sans', system-ui, sans-serif; --mdc-typography-headline6-font-family: 'Plus Jakarta Sans', system-ui, sans-serif; --mdc-typography-headline6-font-weight: 800; --ha-font-weight-medium: 800; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;"
                title: Acqua calda
                size: wide
                content: !include popup-acs.yaml
          triggers_update:
            - sensor.centrale_termica_temperatura_puffer_medioalto
            - sensor.centrale_termica_temperatura_puffer_mediobasso
            - sensor.centrale_termica_temperatura_puffer_basso
            - sensor.tempsolaretermico_temperatura_sonda_solare
            - switch.centrale_termica_pompa_solare_termico
            - input_number.dt_solare_accensione
          styles:
            card:
              - height: 322px
              - padding: 12px 12px 14px
          custom_fields:
            c: |-
              [[[
                // Puffer disegnato nello stesso stile della pompa di calore accanto
                // (scocca smaltata, display a LED): stessa viewBox 600x420, cosi' le due
                // tessere affiancate hanno la stessa scala.
                var num = function (id) {
                  var e = states[id];
                  if (!e || e.state === 'unavailable' || e.state === 'unknown') return null;
                  var v = Number(e.state);
                  return isNaN(v) ? null : v;
                };
                var gr = function (v) { return v === null ? '--' : v.toFixed(1).replace('.', ',') + '°'; };
                // Sopra 48 gradi l'acqua e' pronta, sotto 40 non serve: blu = freddo,
                // come nel resto della dashboard.
                // Scala continua (30 blu, 42 ambra, 52 arancio): con le fasce a soglia
                // 44,9 e 46,3 gradi avevano lo stesso colore e la stratificazione spariva.
                var SCALA = [[30, [79, 163, 255]], [42, [255, 179, 71]], [52, [255, 107, 61]]];
                var tinta = function (t) {
                  if (t === null) return '#5B6470';
                  var a = SCALA[0], b = SCALA[SCALA.length - 1];
                  if (t <= a[0]) b = a;
                  for (var i = 0; i < SCALA.length - 1; i++)
                    if (t >= SCALA[i][0] && t <= SCALA[i + 1][0]) { a = SCALA[i]; b = SCALA[i + 1]; }
                  if (t >= SCALA[SCALA.length - 1][0]) a = b;
                  var f = b[0] === a[0] ? 0 : (t - a[0]) / (b[0] - a[0]);
                  var h = function (k) { return ('0' + Math.round(a[1][k] + (b[1][k] - a[1][k]) * f).toString(16)).slice(-2); };
                  return '#' + h(0) + h(1) + h(2);
                };
                var bagliore = function (t) {
                  if (t === null) return '';
                  return 'filter="drop-shadow(0 0 4px ' + tinta(t) + ')"';
                };
                var S = [num('sensor.centrale_termica_temperatura_puffer_alto'),
                         num('sensor.centrale_termica_temperatura_puffer_medioalto'),
                         num('sensor.centrale_termica_temperatura_puffer_mediobasso'),
                         num('sensor.centrale_termica_temperatura_puffer_basso')];
                var NOMI = ['ALTO', 'MEDIO ALTO', 'MEDIO BASSO', 'BASSO'];
                var validi = S.filter(function (v) { return v !== null; });
                var media = validi.length ? validi.reduce(function (a, b) { return a + b; }, 0) / validi.length : null;
                var pann = num('sensor.tempsolaretermico_temperatura_sonda_solare');
                var circ = states['switch.centrale_termica_pompa_solare_termico'];
                var gira = !!(circ && circ.state === 'on');
                var cSerp = gira ? '#FFF4E0' : '#475569';

                var dton = num('input_number.dt_solare_accensione');
                var salto = (pann === null || S[3] === null) ? null : pann - S[3];
                var fmtSalto = function (v) { return (v > 0 ? '+' : '') + v.toFixed(1).replace('.', ',') + '\u00b0'; };

                // Stratificazione: le quattro sonde dall'alto in basso.
                var stop = '';
                for (var i = 0; i < 4; i++) {
                  stop += '<stop offset="' + (i * 33.3).toFixed(1) + '%" stop-color="' + tinta(S[i]) + '"/>';
                }
                // Tacche delle sonde sul bordo sinistro della finestra, alla loro altezza.
                var Y = [104, 174, 244, 314];
                var tacche = '';
                for (var t = 0; t < 4; t++) {
                  tacche += '<rect x="116" y="' + (Y[t] - 3) + '" width="14" height="6" rx="2" fill="' + tinta(S[t]) + '" ' +
                    bagliore(S[t]) + '/>';
                }

                // Display: modulo a LED come quelli della pompa di calore.
                var display = function (x, y, w, h, etichetta, valore, col, acceso, extra) {
                  return '<g transform="translate(' + x + ',' + y + ')">' +
                    '<rect width="' + w + '" height="' + h + '" rx="6" fill="#05070a" stroke="#1e293b" stroke-width="1.2"/>' +
                    '<circle cx="14" cy="15" r="4" fill="' + col + '" ' + (acceso ? 'filter="drop-shadow(0 0 4px ' + col + ')"' : '') + '/>' +
                    '<text x="24" y="19" fill="' + col + '" font-size="11" class="sub" letter-spacing="0.4">' + etichetta + '</text>' +
                    '<text x="' + (w - 12) + '" y="' + (h - 12) + '" fill="' + col + '" font-size="30" text-anchor="end" class="led" ' +
                    (acceso ? 'filter="drop-shadow(0 0 4px ' + col + ')"' : '') + '>' + valore + '</text>' + (extra || '') + '</g>';
                };
                var colPann = pann === null ? '#5B6470' : tinta(pann);
                var colCirc = gira ? '#4ade80' : '#64748b';
                var destra =
                  // Collettore solare in prospettiva, celle di vetro blu; riflesso se scalda
                  '<g>' +
                  '<path d="M 350 108 L 384 26 L 562 26 L 528 108 Z" fill="url(#pannello)" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round"/>' +
                  '<g stroke="#64748b" stroke-width="1.4" opacity=".8">' +
                  '<path d="M 395 108 L 429 26 M 440 108 L 474 26 M 484 108 L 518 26"/>' +
                  '<path d="M 367 67 L 545 67"/></g>' +
                  (pann !== null && media !== null && pann > media
                    ? '<path d="M 392 34 L 430 34 L 404 98 L 378 98 Z" fill="#fff" opacity=".10"/>' : '') +
                  '</g>' +
                  display(336, 122, 108, 72, 'PANNELLI', gr(pann), colPann, pann !== null) +
                  display(452, 122, 108, 72, 'CIRCOLAT.', gira ? 'ON' : 'OFF', colCirc, gira) +
                  display(336, 204, 108, 66, 'ALTO', gr(S[0]), tinta(S[0]), S[0] !== null) +
                  display(452, 204, 108, 66, 'MEDIO ALTO', gr(S[1]), tinta(S[1]), S[1] !== null) +
                  display(336, 280, 108, 66, 'MEDIO BASSO', gr(S[2]), tinta(S[2]), S[2] !== null) +
                  display(452, 280, 108, 66, 'BASSO', gr(S[3]), tinta(S[3]), S[3] !== null) +
                  // Salto pannelli-fondo: spiega da solo perche' il circolatore e' fermo
                  '<text x="448" y="372" text-anchor="middle" fill="' + (gira ? '#86efac' : '#94a3b8') +
                  '" font-size="13" class="sub">' + (salto === null ? '' : 'SALTO ' + fmtSalto(salto) +
                    (dton === null ? '' : ' \u00b7 ATTIVA A +' + dton.toFixed(1).replace('.', ',') + '\u00b0')) + '</text>';

                // Tubi del solare: mandata calda dal collettore alla serpentina, ritorno
                // freddo con il circolatore. Il flusso scorre solo quando il circolatore gira.
                var cCaldo = gira ? '#FF8A4C' : '#475569', cFreddo = gira ? '#4FA3FF' : '#334155';
                var tubi =
                  '<path d="M 356 92 L 304 92 L 304 254 L 268 254" fill="none" stroke="#1e293b" stroke-width="8" stroke-linejoin="round"/>' +
                  '<path class="flusso" d="M 356 92 L 304 92 L 304 254 L 268 254" fill="none" stroke="' + cCaldo + '" stroke-width="3.5" stroke-linejoin="round"/>' +
                  '<path d="M 268 318 L 322 318 L 322 112 L 346 112" fill="none" stroke="#1e293b" stroke-width="8" stroke-linejoin="round"/>' +
                  '<path class="flusso" d="M 268 318 L 322 318 L 322 112 L 346 112" fill="none" stroke="' + cFreddo + '" stroke-width="3.5" stroke-linejoin="round"/>' +
                  // Circolatore sul ritorno, con la girante che ruota
                  '<circle cx="322" cy="200" r="13" fill="#0f172a" stroke="' + colCirc + '" stroke-width="2.5"/>' +
                  '<g class="girante"><path d="M 322 192 L 322 208 M 314 200 L 330 200" stroke="' + colCirc +
                  '" stroke-width="2.5" stroke-linecap="round"/></g>';

                // Serpentina: elica di quattro spire fra y 254 e 318, centrata nella finestra.
                // Mezze spire alternate: dietro (verso sinistra, curva in su) e davanti
                // (verso destra, curva in giu'); entra e esce a destra verso i tubi.
                var spiraDietro = '', spiraDavanti = 'M 232 254 L 216 254';
                for (var k = 0; k < 8; k++) {
                  var y0 = 254 + k * 8, y1 = y0 + 8, xs = k % 2 ? 144 : 216, xe = k % 2 ? 216 : 144;
                  var cy = (y0 + y1) / 2 + (k % 2 ? 13 : -13);
                  var seg = 'M ' + xs + ' ' + y0 + ' C ' + (xs + (xe - xs) * .25) + ' ' + cy + ' ' + (xs + (xe - xs) * .75) + ' ' + cy + ' ' + xe + ' ' + y1;
                  if (k % 2) spiraDavanti += ' ' + seg; else spiraDietro += seg + ' ';
                }
                spiraDavanti += ' M 216 318 L 232 318';
                var disegno = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" style="display:block">
                  <defs>
                    <style>
                      @keyframes sale { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
                      .serp { stroke-dasharray: 6 6; ${gira ? 'animation: sale 1s linear infinite;' : ''} }
                      @keyframes respira { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
                      .strati { animation: respira 4s ease-in-out infinite; }
                      @media (prefers-reduced-motion: reduce) { .serp, .strati, .flusso, .girante { animation: none !important; } }
                      @keyframes scorre { from { stroke-dashoffset: 16; } to { stroke-dashoffset: 0; } }
                      .flusso { stroke-dasharray: 5 5; ${gira ? 'animation: scorre .7s linear infinite;' : ''} }
                      @keyframes ruota { to { transform: rotate(360deg); } }
                      .girante { transform-origin: 322px 200px; ${gira ? 'animation: ruota .8s linear infinite;' : ''} }
                      .led { font-family: 'Courier New', monospace; font-weight: 900; }
                      .sub { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: 1.2px; font-weight: 700; }
                    </style>
                    <filter id="ombraPuffer" x="-10%" y="-5%" width="120%" height="115%">
                      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
                    </filter>
                    <linearGradient id="smalto" x1="0%" y1="0%" x2="100%" y2="0%">
                      <stop offset="0%" stop-color="#cbd5e1"/>
                      <stop offset="18%" stop-color="#f8fafc"/>
                      <stop offset="45%" stop-color="#ffffff"/>
                      <stop offset="80%" stop-color="#e2e8f0"/>
                      <stop offset="100%" stop-color="#94a3b8"/>
                    </linearGradient>
                    <linearGradient id="calotta" x1="0%" y1="0%" x2="100%" y2="0%">
                      <stop offset="0%" stop-color="#475569"/>
                      <stop offset="40%" stop-color="#94a3b8"/>
                      <stop offset="100%" stop-color="#334155"/>
                    </linearGradient>
                    <linearGradient id="pannello" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#1e3a8a"/>
                      <stop offset="55%" stop-color="#0f1e4d"/>
                      <stop offset="100%" stop-color="#0b1230"/>
                    </linearGradient>
                    <linearGradient id="strati" x1="0%" y1="0%" x2="0%" y2="100%">${stop}</linearGradient>
                    <linearGradient id="vetro" x1="0%" y1="0%" x2="100%" y2="0%">
                      <stop offset="0%" stop-color="#000" stop-opacity=".35"/>
                      <stop offset="30%" stop-color="#000" stop-opacity="0"/>
                      <stop offset="75%" stop-color="#fff" stop-opacity=".10"/>
                      <stop offset="100%" stop-color="#000" stop-opacity=".30"/>
                    </linearGradient>
                  </defs>

                  <ellipse cx="180" cy="398" rx="106" ry="11" fill="#000" opacity="0.25"/>
                  <g fill="#1e293b" stroke="#0f172a" stroke-width="1.5">
                    <path d="M 112 370 L 140 370 L 146 392 L 106 392 Z"/>
                    <path d="M 220 370 L 248 370 L 254 392 L 214 392 Z"/>
                  </g>

                  <g filter="url(#ombraPuffer)">
                    <rect x="92" y="34" width="176" height="342" rx="44" fill="url(#smalto)" stroke="#94a3b8" stroke-width="1.5"/>
                    <path d="M 92 78 Q 92 34 136 34 L 224 34 Q 268 34 268 78 L 268 70 Q 180 54 92 70 Z" fill="url(#calotta)"/>
                    <path d="M 92 332 Q 180 350 268 332 L 268 332 Q 268 376 224 376 L 136 376 Q 92 376 92 332 Z" fill="url(#calotta)"/>
                  </g>
                  <rect x="171" y="20" width="18" height="18" rx="3" fill="#64748b" stroke="#334155"/>
                  <rect x="68" y="96" width="26" height="12" rx="3" fill="#94a3b8" stroke="#475569"/>
                  <rect x="68" y="300" width="26" height="12" rx="3" fill="#94a3b8" stroke="#475569"/>

                  <!-- Finestra con la stratificazione: i colori sono le quattro sonde -->
                  <rect x="124" y="82" width="112" height="252" rx="22" fill="#0b1220" stroke="#334155" stroke-width="2"/>
                  <rect class="strati" x="130" y="88" width="100" height="240" rx="18" fill="url(#strati)" opacity=".9"/>
                  <!-- Serpentina del solare termico nella parte bassa -->
                  <path d="${spiraDietro}" fill="none" stroke="${cSerp}" stroke-width="3.5" stroke-linecap="round" opacity=".35"/>
                  <path class="serp" d="${spiraDavanti}" fill="none" stroke="${cSerp}" stroke-width="4.5" stroke-linecap="round" opacity=".95"/>
                  <rect x="130" y="88" width="100" height="240" rx="18" fill="url(#vetro)"/>

                  <!-- Targhetta -->
                  <g transform="translate(130, 344)">
                    <rect width="100" height="20" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
                    <text x="50" y="14" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="9" font-weight="900" letter-spacing="0.8">ACQUA CALDA</text>
                  </g>
                  ${tubi}
                  ${tacche}
                  ${destra}
                </svg>`;

                var voci = [['Media serbatoio', gr(media), tinta(media)],
                            ['Pannelli solari', gr(pann), colPann],
                            ['Circolatore', gira ? 'In marcia' : 'Fermo', gira ? '#4ade80' : '#8A93A0']];
                var riga = '';
                for (var q = 0; q < voci.length; q++) {
                  riga += '<div style="flex:1;min-width:0;text-align:center;">' +
                    '<div style="font-size:12px;color:#8A93A0;">' + voci[q][0] + '</div>' +
                    '<div style="font-size:16px;font-weight:700;margin-top:3px;color:' + voci[q][2] + ';">' +
                    voci[q][1] + '</div></div>';
                }
                return '<div style="width:100%;">' + disegno +
                  '<div style="display:flex;gap:8px;margin-top:6px;">' + riga + '</div></div>';
              ]]]

# ======================= COLONNA DESTRA =======================
- type: vertical-stack
  view_layout: {grid-column: 11 / span 4, grid-row: 3}
  cards:
    - type: custom:button-card
      template: sezione
      variables: {titolo: Oggi}
    # ---------------- OGGI ----------------
    - type: custom:button-card
      template: tessera
      styles:
        card:
          - height: 160px
      entity: sensor.produzione_giornaliera_fv
      triggers_update:
        - sensor.immissioni_giornaliere
        - sensor.prelievi_giornalieri
      custom_fields:
        c: >
          [[[
            var num = function (id) {
              var e = states[id];
              if (!e || e.state === 'unavailable' || e.state === 'unknown') return null;
              var v = Number(e.state);
              return isNaN(v) ? null : v;
            };
            var kwh = function (v) { return v === null ? '--' : v.toFixed(1).replace('.', ',') + ' kWh'; };
            var prod = num('sensor.produzione_giornaliera_fv');
            var imm = num('sensor.immissioni_giornaliere');
            var pre = num('sensor.prelievi_giornalieri');
            var auto = null;
            if (prod !== null && imm !== null && pre !== null) {
              var cons = prod - imm + pre;
              if (cons > 0.05) auto = Math.max(0, Math.min(100, ((cons - pre) / cons) * 100));
            }
            var R = 46, L = 2 * Math.PI * R, f = auto === null ? 0 : auto / 100;
            var anello = '<svg width="124" height="124" viewBox="0 0 124 124">' +
              '<circle cx="62" cy="62" r="' + R + '" fill="none" stroke="#1C222A" stroke-width="13"/>' +
              '<circle cx="62" cy="62" r="' + R + '" fill="none" stroke="#6FD39B" stroke-width="13" ' +
              'stroke-linecap="round" stroke-dasharray="' + (L * f).toFixed(1) + ' ' + L.toFixed(1) +
              '" transform="rotate(-90 62 62)"/>' +
              '<text x="62" y="66" text-anchor="middle" font-size="26" font-weight="800" ' +
              'fill="#EEF0F3">' + (auto === null ? '--' : Math.round(auto) + '%') + '</text>' +
              '<text x="62" y="86" text-anchor="middle" font-size="11" fill="#8A93A0">dal sole</text></svg>';
            var riga = function (col, nome, v) {
              return '<div style="display:flex;align-items:center;gap:8px;">' +
                '<span style="width:10px;height:10px;border-radius:3px;background:' + col +
                ';flex:none;"></span><span style="flex:1;font-size:14px;color:#8A93A0;">' + nome +
                '</span><span style="font-size:15px;font-weight:700;color:#EEF0F3;' +
                'font-variant-numeric:tabular-nums;">' + kwh(v) + '</span></div>';
            };
            return '<div style="display:flex;flex-direction:column;height:100%;text-align:left;">' +
              
              '<div style="flex:1;display:flex;align-items:center;gap:18px;">' + anello +
              '<div style="flex:1;display:flex;flex-direction:column;gap:12px;">' +
              riga('#FFC94D', 'Prodotta', prod) + riga('#FF8A65', 'Presa dalla rete', pre) +
              riga('#5CB0FF', 'Ceduta alla rete', imm) + '</div></div></div>';
          ]]]
    # ---------------- BATTERIA ----------------
    - type: custom:button-card
      template: tessera
      styles:
        card:
          - height: 140px
      entity: sensor.monitoring_accumulo_fv_jk_bms_state_of_charge
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            style: "--popup-background-color: #0E1116; --popup-border-radius: 28px; --mdc-theme-surface: #0E1116; --primary-background-color: #0E1116; --ha-font-family-body: 'Plus Jakarta Sans', system-ui, sans-serif; --mdc-typography-font-family: 'Plus Jakarta Sans', system-ui, sans-serif; --mdc-typography-headline6-font-family: 'Plus Jakarta Sans', system-ui, sans-serif; --mdc-typography-headline6-font-weight: 800; --ha-font-weight-medium: 800; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;"
            title: Batteria
            size: wide
            content: !include popup-batteria.yaml
      triggers_update:
        - sensor.monitoring_accumulo_fv_jk_bms_power
        - sensor.batteria_caricata_oggi
        - sensor.batteria_scaricata_oggi
      custom_fields:
        c: >
          [[[
            var num = function (id) {
              var e = states[id];
              if (!e || e.state === 'unavailable' || e.state === 'unknown') return null;
              var v = Number(e.state);
              return isNaN(v) ? null : v;
            };
            var soc = num('sensor.monitoring_accumulo_fv_jk_bms_state_of_charge');
            var bat = num('sensor.monitoring_accumulo_fv_jk_bms_power');
            var su = num('sensor.batteria_caricata_oggi');
            var giu = num('sensor.batteria_scaricata_oggi');
            var off = soc === null || bat === null;
            var col = off ? '#5B6470' : (soc < 20 ? '#FF8A80' : '#4FD1C5');
            var stato = off ? 'BMS non raggiungibile'
              : (bat > 20 ? 'In carica · ' + (bat / 1000).toFixed(1).replace('.', ',') + ' kW'
                 : (bat < -20 ? 'In scarica · ' + (-bat / 1000).toFixed(1).replace('.', ',') + ' kW'
                    : 'Ferma'));
            /* Batteria realistica: involucro metallico, vetro scuro, celle LED che si accendono a gruppi
               del 10%; in carica l'ultima cella accesa pulsa. */
            var celle = '';
            var piene = off ? 0 : Math.round(soc / 10);
            for (var i = 0; i < 10; i++) {
              var accesa = i < piene, ultima = i === piene - 1 && bat > 20;
              celle += '<rect x="' + (14 + i * 21) + '" y="12" width="17" height="32" rx="3" fill="' +
                (accesa ? 'url(#batLed)' : '#111827') + '"' +
                (accesa ? ' style="filter:drop-shadow(0 0 3px ' + col + ')' + (ultima ? ';animation:batPulsa 1.6s ease-in-out infinite' : '') + '"' : '') + '/>';
            }
            var svg = '<svg viewBox="0 0 250 56" style="width:100%;display:block;">' +
              '<style>@keyframes batPulsa{50%{opacity:.35}}@media (prefers-reduced-motion:reduce){rect{animation:none!important}}</style>' +
              '<defs><linearGradient id="batCassa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/>' +
              '<stop offset=".25" stop-color="#cbd5e1"/><stop offset=".6" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/></linearGradient>' +
              '<linearGradient id="batVetro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e293b"/>' +
              '<stop offset="1" stop-color="#020617"/></linearGradient>' +
              '<linearGradient id="batLed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>' +
              '<stop offset=".25" stop-color="' + col + '"/><stop offset="1" stop-color="' + col + '" stop-opacity=".75"/></linearGradient>' +
              '<linearGradient id="batPolo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/>' +
              '<stop offset=".5" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/></linearGradient></defs>' +
              '<rect x="2" y="2" width="232" height="52" rx="10" fill="url(#batCassa)"/>' +
              '<rect x="8" y="7" width="220" height="42" rx="6" fill="url(#batVetro)"/>' +
              '<rect x="236" y="17" width="11" height="22" rx="3" fill="url(#batPolo)"/>' + celle +
              '<rect x="8" y="7" width="220" height="12" rx="6" fill="#fff" opacity=".06"/></svg>';
            var kwh = function (v) { return v === null ? '--' : v.toFixed(1).replace('.', ','); };
            return '<div style="display:flex;flex-direction:column;justify-content:space-between;' +
              'height:100%;text-align:left;">' +
              '<div style="display:flex;justify-content:space-between;align-items:baseline;">' +
              '<span style="font-size:18px;font-weight:700;color:#EEF0F3;">Batteria</span>' +
              '<span style="font-size:32px;font-weight:800;letter-spacing:-.03em;color:' + col + ';">' +
              (off ? 'n.d.' : Math.round(soc) + '%') + '</span></div>' + svg +
              '<div style="display:flex;justify-content:space-between;font-size:14px;color:#8A93A0;">' +
              '<span style="color:' + (off ? '#8A93A0' : col) + ';font-weight:600;">' + stato + '</span>' +
              '<span>oggi +' + kwh(su) + ' / −' + kwh(giu) + ' kWh</span></div></div>';
          ]]]
    - type: custom:button-card
      template: sezione
      variables: {titolo: Elettrodomestici, nota: tocca per i dettagli}
    # ---------------- ELETTRODOMESTICI ----------------
    # Mostra solo gli apparecchi che stanno consumando (lavatrice, lavastoviglie,
    # asciugatrice, piano induzione, condizionatori); se nessuno consuma, un
    # avviso. Il tocco apre sempre un
    # popup (browser_mod) con le card animate di sionetta/wm_animated_ha_card,
    # installata come copia locale tradotta in italiano
    # (www/washing-machine-card.js, risorsa ?v=1.4.0-it1).
    # sensor.stato_* resta "Finito" fino al ciclo successivo, anche per
    # settimane: qui "Finito" diventa "ferma" con la data dell'ultimo ciclo,
    # per non far credere che ci sia un bucato appena pronto.
    - type: custom:button-card
      template: tessera
      entity: sensor.stato_lavatrice
      triggers_update:
        - sensor.stato_lavastoviglie
        - sensor.stato_asciugatrice
        - sensor.presalavatrice_power
        - sensor.presalavastoviglie_power
        - sensor.presaasciugatrice_power
        - sensor.consumopianoinduzione_power
        - sensor.consumocondizionatori_power
        - sensor.condizionatori_accesi
        - sensor.consumo_giornaliero_condizionatori
      card_mod:
        style: |
          :host { display: block; height: 100%; }
          @keyframes eVibra { 0%, 100% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(-1px, 0) rotate(-4deg); } 75% { transform: translate(1px, 0) rotate(4deg); } }
          @keyframes eDondola { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
          @keyframes ePulsa { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.12); opacity: .75; } }
          @keyframes eCalore { 0%, 100% { filter: drop-shadow(0 0 1px var(--alone)); } 50% { filter: drop-shadow(0 0 7px var(--alone)); } }
          @keyframes eGira { to { transform: rotate(360deg); } }
          @media (prefers-reduced-motion: reduce) { .moto { animation: none !important; } }
      styles:
        card:
          - height: 234px
          - padding: 10px 16px
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            style: "--popup-background-color: #0E1116; --popup-border-radius: 28px; --mdc-theme-surface: #0E1116; --primary-background-color: #0E1116; --ha-font-family-body: 'Plus Jakarta Sans', system-ui, sans-serif; --mdc-typography-font-family: 'Plus Jakarta Sans', system-ui, sans-serif; --mdc-typography-headline6-font-family: 'Plus Jakarta Sans', system-ui, sans-serif; --mdc-typography-headline6-font-weight: 800; --ha-font-weight-medium: 800; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;"
            title: Elettrodomestici
            size: wide
            content:
              type: grid
              columns: 3
              square: false
              cards:
                - type: custom:washing-machine-card
                  appliance_type: washer
                  name: Lavatrice
                  status_entity: sensor.stato_lavatrice
                  running_states: ['In funzione']
                  power_entity: sensor.presalavatrice_power
                  power_threshold: 5
                  power_max: 2200
                  plug_entity: switch.presalavatrice
                  notify_entity: automation.notifica_lavatrice_finita
                  language: it
                  theme: ha
                  card_mod: &macchina
                    style: |
                      :host { --wm-grad: #12161B !important; --wm-panel-bg: #1A2028 !important;
                        --wm-panel-border: transparent !important; --wm-icon-bg: #1A2028 !important;
                        --wm-btn-bg: #1A2028 !important; --wm-btn-border: transparent !important;
                        --wm-text: #EEF0F3 !important; --wm-muted: #8A93A0 !important;
                        --wm-label: #8A93A0 !important; --wm-ring-track: #232A33 !important;
                        --wm-bar-bg: #232A33 !important; --wm-divider: #1C222A !important;
                        font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
                      ha-card { box-shadow: none !important; border: none !important; }
                - type: custom:washing-machine-card
                  appliance_type: dishwasher
                  name: Lavastoviglie
                  status_entity: sensor.stato_lavastoviglie
                  running_states: ['In funzione']
                  power_entity: sensor.presalavastoviglie_power
                  power_threshold: 5
                  power_max: 2400
