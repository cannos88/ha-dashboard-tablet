# ===========================================================================
# VISTA "Energia" - dashboard Tablet
#   sinistra (8/12): Adesso (flusso), Riscaldamento e acqua calda
#   destra   (4/12): Oggi, Batteria, Elettrodomestici (apre un popup)
# Colori di ruolo: sole #FFC94D, rete #FF8A65, accumulo #4FD1C5, casa #5CB0FF,
# autosufficienza #6FD39B.
# ===========================================================================
- !include rail.yaml
- !include testata.yaml

# ======================= COLONNA SINISTRA =======================
- type: vertical-stack
  view_layout: {grid-column: 3 / span 8, grid-row: 3}
  cards:
    # Il giudizio sull'autoconsumo sta nell'intestazione, non nella tessera.
    - type: custom:button-card
      template: sezione
      entity: sensor.solaredge_i2_ac_power
      triggers_update: [sensor.potenza_esportata]
      variables:
        titolo: Adesso
        nota: >
          [[[
            var n = function (id) { var e = states[id]; var v = e ? Number(e.state) : NaN; return isNaN(v) ? 0 : v; };
            var sole = n('sensor.solaredge_i2_ac_power'), esp = n('sensor.potenza_esportata');
            if (sole <= 20) return 'nessuna produzione';
            var q = (sole - esp) / sole * 100;
            return q >= 95 ? 'tutto il sole resta in casa'
              : (q >= 70 ? 'quasi tutto il sole resta in casa' : Math.round(100 - q) + '% del sole va in rete');
          ]]]
    # ---------------- FLUSSO DI POTENZA ----------------
    # La casa sta sull'orizzonte, con accumulo a sinistra e rete a destra. Il
    # sole percorre l'arco del cielo sopra la casa nella sua posizione reale:
    # la frazione di giornata trascorsa fra alba e tramonto di oggi (MeteoRadar)
    # lo porta da sinistra (alba) a destra (tramonto), sopra la casa a meta'
    # giornata. Di notte il sole e' sotto l'orizzonte e sull'arco va la luna,
    # con l'ora dell'alba. Il ramo sole -> casa parte da dove sta il sole.
    # Logica dei rami invariata (verificata sulla Mobile su sei scenari): verso
    # reale, soglia 20 W, stato "n.d." quando il BMS non risponde. I tratti
    # scorrono nel verso del flusso. sensor.time_2 lo ridisegna ogni minuto,
    # cosi' il sole si muove anche quando le potenze restano ferme.
    - type: custom:button-card
      template: tessera
      entity: sensor.potenza_casa
      triggers_update:
        - sensor.solaredge_i2_ac_power
        - sensor.potenza_prelevata
        - sensor.potenza_esportata
        - sensor.monitoring_accumulo_fv_jk_bms_state_of_charge
        - sensor.monitoring_accumulo_fv_jk_bms_power
        - sensor.meteoradar_current_sunrise
        - sensor.meteoradar_current_sunset
        - sensor.time_2
      card_mod:
        style: |
          :host { display: block; height: 100%; }
          @keyframes flusso { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
          @keyframes raggi { to { transform: rotate(360deg); } }
      styles:
        card:
          - height: 224px
          - padding: 14px 22px 12px
          - background: >
              [[[
                // Il cielo del riquadro cambia con l'ora: caldo di giorno, blu di notte.
                var a = states['sensor.meteoradar_current_sunrise'], t = states['sensor.meteoradar_current_sunset'];
                var ora = Date.now();
                var giorno = a && t && ora >= new Date(a.state).getTime() && ora <= new Date(t.state).getTime();
                return giorno ? 'linear-gradient(180deg, rgba(255,201,77,.07), #12161B 70%)'
                              : 'linear-gradient(180deg, rgba(92,120,255,.08), #12161B 70%)';
              ]]]
      custom_fields:
        c: >
          [[[
              var num = function (id) {
                var e = states[id];
                if (!e || e.state === 'unavailable' || e.state === 'unknown') return null;
                var v = Number(e.state);
                return isNaN(v) ? null : v;
              };
              var pot = function (v) {
                if (v === null) return '--';
                var a = Math.abs(v);
                if (a >= 1000) return (a / 1000).toFixed(1).replace('.', ',') + ' kW';
                return Math.round(a) + ' W';
              };
              var hm = function (d) { return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); };
              var sole = num('sensor.solaredge_i2_ac_power') || 0;
              var prel = num('sensor.potenza_prelevata') || 0;
              var esp = num('sensor.potenza_esportata') || 0;
              var casa = num('sensor.potenza_casa');
              var soc = num('sensor.monitoring_accumulo_fv_jk_bms_state_of_charge');
              var bat = num('sensor.monitoring_accumulo_fv_jk_bms_power');
              var accOff = (soc === null || bat === null);

              // Sotto i 20 W e' rumore di misura, non un flusso.
              var SOGLIA = 20;
              var GIALLO = '#FFC94D', CORALLO = '#FF8A65', TEAL = '#4FD1C5', CIELO = '#5CB0FF',
                  LUNA = '#C9D3FF', SPENTO = '#3A434F';

              // ---- posizione del sole (o della luna) sull'arco ----
              var W = 900, H = 236, ORIZ = 150, CX = 450, RX = 395, RY = 118;
              var sA = states['sensor.meteoradar_current_sunrise'], sT = states['sensor.meteoradar_current_sunset'];
              var alba = sA ? new Date(sA.state) : null, tram = sT ? new Date(sT.state) : null;
              var adesso = new Date();
              var giorno = true, f = 0.5;
              if (alba && tram && !isNaN(alba) && !isNaN(tram)) {
                if (adesso >= alba && adesso <= tram) {
                  f = (adesso - alba) / (tram - alba);
                } else {
                  // Notte: la luna fa lo stesso arco dal tramonto all'alba successiva
                  // (le date di MeteoRadar sono quelle di oggi: si spostano di un giorno).
                  giorno = false;
                  var g = 24 * 3600 * 1000;
                  var da = adesso > tram ? tram.getTime() : tram.getTime() - g;
                  var a2 = adesso > tram ? alba.getTime() + g : alba.getTime();
                  f = (adesso - da) / (a2 - da);
                }
              }
              f = Math.max(0, Math.min(1, f));
              var astroX = CX - RX * Math.cos(Math.PI * f);
              var astroY = ORIZ - RY * Math.sin(Math.PI * f);
              var prossimaAlba = alba ? new Date(adesso > alba ? alba.getTime() + 24 * 3600 * 1000 : alba.getTime()) : null;

              // Accumulo e rete vicini alla casa, dentro l'arco: il sole basso non li tocca.
              var P = {sole: [astroX, astroY], acc: [285, ORIZ], casa: [CX, ORIZ], rete: [615, ORIZ]};
              var RN = 32;

              // Ramo fra due nodi, dal bordo di un cerchio all'altro e nel verso del flusso.
              var ramo = function (da, a, attivo, col) {
                var x0 = P[da][0], y0 = P[da][1], x1 = P[a][0], y1 = P[a][1];
                var dx = x1 - x0, dy = y1 - y0, l = Math.sqrt(dx * dx + dy * dy) || 1;
                return '<path d="M ' + (x0 + dx / l * (RN + 8)).toFixed(1) + ' ' + (y0 + dy / l * (RN + 8)).toFixed(1) +
                  ' L ' + (x1 - dx / l * (RN + 8)).toFixed(1) + ' ' + (y1 - dy / l * (RN + 8)).toFixed(1) +
                  '" fill="none" stroke="' + (attivo ? col : SPENTO) + '" stroke-width="' + (attivo ? 5 : 3) +
                  '" stroke-linecap="round" stroke-dasharray="' + (attivo ? '2 10' : '1 8') + '"' +
                  (attivo ? ' style="animation:flusso .9s linear infinite;"' : '') + '/>';
              };
              // Raggio del sole: curva che sale sopra gli altri nodi e scende sul tetto,
              // cosi' con il sole basso non si sovrappone ai rami di rete e accumulo.
              var raggio = function (attivo) {
                var x0 = P.sole[0], y0 = P.sole[1], x1 = CX, y1 = ORIZ - RN - 8;
                // Sole alto: raggio dritto. Sole basso: curva che scavalca gli altri nodi.
                var basso = y0 > ORIZ - 70;
                var qx = (x0 + x1) / 2, qy = basso ? Math.max(6, Math.min(y0, y1) - 60) : (y0 + y1) / 2;
                var dx = qx - x0, dy = qy - y0, l = Math.sqrt(dx * dx + dy * dy) || 1;
                var sx = x0 + dx / l * (RN + 8), sy = y0 + dy / l * (RN + 8);
                return '<path d="M ' + sx.toFixed(1) + ' ' + sy.toFixed(1) + ' Q ' + qx.toFixed(1) + ' ' + qy.toFixed(1) +
                  ' ' + x1 + ' ' + y1 + '" fill="none" stroke="' + (attivo ? GIALLO : SPENTO) + '" stroke-width="' +
                  (attivo ? 5 : 3) + '" stroke-linecap="round" stroke-dasharray="' + (attivo ? '2 10' : '1 8') + '"' +
                  (attivo ? ' style="animation:flusso .9s linear infinite;"' : '') + '/>';
              };
              var rami = '';
              if (giorno) rami += raggio(sole > SOGLIA);
              if (prel > SOGLIA) rami += ramo('rete', 'casa', true, CORALLO);
              else if (esp > SOGLIA) rami += ramo('casa', 'rete', true, CORALLO);
              else rami += ramo('rete', 'casa', false);
              if (accOff) rami += ramo('acc', 'casa', false);
              else if (bat > SOGLIA) rami += ramo('casa', 'acc', true, TEAL);
              else if (bat < -SOGLIA) rami += ramo('acc', 'casa', true, TEAL);
              else rami += ramo('acc', 'casa', false);

              var DEFS = '<defs>' +
                '<radialGradient id="enSole" cx="40%" cy="38%" r="65%"><stop offset="0" stop-color="#FFFBEA"/>' +
                '<stop offset=".45" stop-color="#FFD45C"/><stop offset="1" stop-color="#F59E0B"/></radialGradient>' +
                '<radialGradient id="enLuna" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="#F1F5F9"/>' +
                '<stop offset=".6" stop-color="#C9D3E3"/><stop offset="1" stop-color="#8A96AB"/></radialGradient>' +
                '<linearGradient id="enMuro" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cbd5e1"/>' +
                '<stop offset=".4" stop-color="#f8fafc"/><stop offset="1" stop-color="#b6c2d1"/></linearGradient>' +
                '<linearGradient id="enTetto" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#94a3b8"/>' +
                '<stop offset="1" stop-color="#475569"/></linearGradient>' +
                '<linearGradient id="enPv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B5B8C"/>' +
                '<stop offset=".5" stop-color="#16243D"/><stop offset="1" stop-color="#0B1426"/></linearGradient>' +
                '<linearGradient id="enSmalto" x1="0" y1="0" x2="1" y2=".8"><stop offset="0" stop-color="#ffffff"/>' +
                '<stop offset=".3" stop-color="#f1f5f9"/><stop offset=".75" stop-color="#e2e8f0"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>' +
                '<linearGradient id="enVetro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e293b"/>' +
                '<stop offset=".5" stop-color="#090d16"/><stop offset="1" stop-color="#020617"/></linearGradient>' +
                '<linearGradient id="enAcciaio" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#64748b"/>' +
                '<stop offset=".5" stop-color="#e2e8f0"/><stop offset="1" stop-color="#64748b"/></linearGradient>' +
                '<filter id="enOmbra" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" ' +
                'stdDeviation="4" flood-color="#000" flood-opacity=".5"/></filter>' +
                '</defs>';
              /* Figure realistiche al posto delle icone: centrate su (x, y), circa 70 x 70. */
              var figura = function (k, x, y, col, attivo) {
                var T = 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ')';
                var alone = attivo ? '<circle r="44" fill="' + col + '" opacity=".14"/>' : '';
                if (k === 'sole') {
                  var raggi = '';
                  for (var i = 0; i < 12; i++)
                    raggi += '<path d="M0 -40 L4 -30 L-4 -30 Z" fill="#FFD45C" opacity="' + (attivo ? '.85' : '.35') +
                      '" transform="rotate(' + (i * 30) + ')"/>';
                  return '<g transform="' + T + '">' + alone +
                    '<g style="transform-origin:0 0;animation:raggi 40s linear infinite">' + raggi + '</g>' +
                    '<circle r="25" fill="url(#enSole)"' + (attivo ? ' style="filter:drop-shadow(0 0 10px #FFC94D)"' : ' opacity=".6"') + '/></g>';
                }
                if (k === 'luna')
                  return '<g transform="' + T + '"><circle r="24" fill="url(#enLuna)" style="filter:drop-shadow(0 0 8px rgba(201,211,255,.5))"/>' +
                    '<circle cx="-8" cy="-6" r="5" fill="#9AA6BA" opacity=".55"/><circle cx="8" cy="7" r="3.5" fill="#9AA6BA" opacity=".5"/>' +
                    '<circle cx="5" cy="-11" r="2.5" fill="#9AA6BA" opacity=".45"/></g>';
                if (k === 'casa') {
                  var luce = attivo ? '#FFD27A' : '#334155';
                  var finestra = function (fx) { return '<rect x="' + fx + '" y="2" width="11" height="11" rx="1.5" fill="' + luce + '"' +
                    (attivo ? ' style="filter:drop-shadow(0 0 4px #FFC94D)"' : '') + '/>'; };
                  return '<g transform="' + T + '" filter="url(#enOmbra)">' + alone +
                    '<rect x="-28" y="-8" width="56" height="40" fill="url(#enMuro)" stroke="#94a3b8" stroke-width="1"/>' +
                    '<path d="M-36 -6 L0 -34 L36 -6 L36 0 L0 -28 L-36 0 Z" fill="url(#enTetto)"/>' +
                    '<path d="M2 -26 L28 -6 L16 -6 L-6 -22 Z" fill="url(#enPv)" stroke="#94a3b8" stroke-width=".8"/>' +
                    finestra(-22) + finestra(11) +
                    '<rect x="-6" y="12" width="12" height="20" rx="1.5" fill="#475569"/><circle cx="3" cy="22" r="1.2" fill="#e2e8f0"/></g>';
                }
                if (k === 'acc') {
                  var livello = accOff ? 0 : Math.max(0, Math.min(5, Math.round((soc || 0) / 20)));
                  var tacche = '';
                  for (var j = 0; j < 5; j++)
                    tacche += '<rect x="-11" y="' + (14 - j * 7) + '" width="22" height="5" rx="1.2" fill="' +
                      (j < livello ? col : '#1e293b') + '"' + (j < livello && attivo ? ' style="filter:drop-shadow(0 0 3px ' + col + ')"' : '') + '/>';
                  return '<g transform="' + T + '"><g filter="url(#enOmbra)">' + alone +
                    '<rect x="-22" y="-32" width="44" height="64" rx="7" fill="url(#enSmalto)" stroke="#94a3b8" stroke-width="1"/></g>' +
                    '<rect x="-16" y="-24" width="32" height="48" rx="4" fill="url(#enVetro)"/>' + tacche +
                    '<circle cx="0" cy="-17" r="2.2" fill="' + (accOff ? '#5B6470' : col) + '"/></g>';
                }
                /* rete: traliccio in acciaio con i cavi */
                return '<g transform="' + T + '" filter="url(#enOmbra)">' + alone +
                  '<g fill="none" stroke="url(#enAcciaio)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">' +
                  '<path d="M-14 32 L-4 -30 L4 -30 L14 32"/><path d="M-24 -16 L24 -16 M-20 -2 L20 -2"/>' +
                  '<path d="M-10 6 L10 18 M10 6 L-10 18 M-7 -12 L7 0 M7 -12 L-7 0"/></g>' +
                  '<g stroke="' + (attivo ? col : '#64748b') + '" stroke-width="1.2" opacity=".8">' +
                  '<path d="M-24 -16 q-12 6 -22 4 M24 -16 q12 6 22 4 M-20 -2 q-12 6 -24 4 M20 -2 q12 6 24 4"/></g></g>';
              };
              // Nodo: figura realistica; etichetta sotto (sull'orizzonte) o di lato (in cielo).
              var nodo = function (k, icona, col, attivo, nome, val, lato) {
                var x = P[k][0], y = P[k][1];
                var g = figura(icona, x, y, col, attivo);
                var tx, ty, anc;
                if (lato === 'sotto') { tx = x; ty = y + RN + 24; anc = 'middle'; }
                else { tx = lato === 'destra' ? x + RN + 22 : x - RN - 22; ty = y - 4; anc = lato === 'destra' ? 'start' : 'end'; }
                g += '<text x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) + '" text-anchor="' + anc + '" font-size="15" ' +
                  'fill="#8A93A0">' + nome + '</text>';
                g += '<text x="' + tx.toFixed(1) + '" y="' + (ty + 27).toFixed(1) + '" text-anchor="' + anc + '" ' +
                  'font-size="26" font-weight="800" letter-spacing="-1" fill="' + (attivo ? col : '#EEF0F3') + '">' +
                  val + '</text>';
                return g;
              };

              // Cielo: arco tratteggiato e orizzonte; la parte gia' percorsa e' piu' chiara.
              var arco = function (da, a) {
                var p = '';
                for (var i = 0; i <= 40; i++) {
                  var t = da + (a - da) * i / 40;
                  p += (i ? ' L ' : 'M ') + (CX - RX * Math.cos(Math.PI * t)).toFixed(1) + ' ' +
                    (ORIZ - RY * Math.sin(Math.PI * t)).toFixed(1);
                }
                return p;
              };
              var cielo = '<path d="' + arco(0, 1) + '" fill="none" stroke="#232A33" stroke-width="2" stroke-dasharray="2 7"/>' +
                '<path d="' + arco(0, f) + '" fill="none" stroke="' + (giorno ? 'rgba(255,201,77,.35)' : 'rgba(201,211,255,.25)') +
                '" stroke-width="2" stroke-dasharray="2 7"/>' +
                '<line x1="40" y1="' + ORIZ + '" x2="' + (W - 40) + '" y2="' + ORIZ + '" stroke="#232A33" stroke-width="2"/>' +
                // tacche di alba e tramonto agli estremi dell'arco
                '<text x="' + (CX - RX) + '" y="' + (ORIZ + 26) + '" text-anchor="middle" font-size="13" fill="#6B7480">' +
                (alba ? hm(alba) : '') + '</text>' +
                '<text x="' + (CX + RX) + '" y="' + (ORIZ + 26) + '" text-anchor="middle" font-size="13" fill="#6B7480">' +
                (tram ? hm(tram) : '') + '</text>';

              var nomeRete = prel > SOGLIA ? 'Dalla rete' : (esp > SOGLIA ? 'Verso la rete' : 'Rete');
              var valRete = prel > SOGLIA ? pot(prel) : (esp > SOGLIA ? pot(esp) : '0 W');
              var nomeAcc = accOff ? 'Accumulo' : (bat > SOGLIA ? 'In carica' : (bat < -SOGLIA ? 'In scarica' : 'Accumulo'));
              // L'etichetta dell'astro sta dal lato opposto a quello verso cui scende.
              var latoAstro = f < 0.5 ? 'destra' : 'sinistra';
              var astro = giorno
                ? nodo('sole', 'sole', GIALLO, sole > SOGLIA, 'Dal sole', pot(sole), latoAstro)
                : nodo('sole', 'luna', LUNA, false, 'Notte', prossimaAlba ? 'alba ' + hm(prossimaAlba) : '', latoAstro);

              var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:100%;display:block;' +
                'overflow:visible;">' + DEFS + cielo + rami +
                nodo('acc', 'acc', TEAL, !accOff && Math.abs(bat) > SOGLIA, nomeAcc, accOff ? 'n.d.' : pot(bat), 'sotto') +
                nodo('rete', 'rete', CORALLO, prel > SOGLIA || esp > SOGLIA, nomeRete, valRete, 'sotto') +
                nodo('casa', 'casa', CIELO, true, 'Casa', pot(casa), 'sotto') +
                astro + '</svg>';
              return '<div style="height:100%;box-sizing:border-box;">' + svg + '</div>';
          ]]]
    - type: custom:button-card
      template: sezione
      variables: {titolo: Riscaldamento e acqua calda}
    - type: grid
      columns: 2
      square: false
      cards:
        # ---------------- POMPA DI CALORE ----------------
        # Stesso disegno della vista Energia della Mobile (unita' esterna con
        # ventola animata, display a LED di mandata, ritorno e portata,
        # circolatore): il corpo JS e' copiato tale e quale, cambia solo la
        # palette della riga dei valori sotto il disegno. Il COP c'e' solo con la
        # PdC in marcia; a riposo compare l'ultimo misurato (sensor.pdc_cop_ultimo).
        - type: custom:button-card
          template: tessera
          entity: sensor.centrale_termica_flusso_pdc
          tap_action:
            action: fire-dom-event
            browser_mod:
              service: browser_mod.popup
              data:
                style: "--popup-background-color: #0E1116; --popup-border-radius: 28px; --mdc-theme-surface: #0E1116; --primary-background-color: #0E1116; --ha-font-family-body: 'Plus Jakarta Sans', system-ui, sans-serif; --mdc-typography-font-family: 'Plus Jakarta Sans', system-ui, sans-serif; --mdc-typography-headline6-font-family: 'Plus Jakarta Sans', system-ui, sans-serif; --mdc-typography-headline6-font-weight: 800; --ha-font-weight-medium: 800; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;"
                title: Pompa di calore
                size: wide
                content: !include popup-pdc.yaml
          triggers_update:
            - sensor.centrale_termica_temperatura_mandata_pdc
            - sensor.centrale_termica_temperatura_ritorno_pdc
            - sensor.centrale_termica_delta_t_pdc
            - sensor.centrale_termica_potenza_termica_pdc
            - sensor.consumo_attuale_pdc
            - binary_sensor.stato_pdc
            - sensor.pdc_cop
            - sensor.pdc_cop_ultimo
          styles:
            card:
              - height: 322px
              - padding: 12px 12px 14px
          custom_fields:
            c: |-
              [[[
                function num(i) {
                  var e = states[i];
                  if (!e || e.state === 'unavailable' || e.state === 'unknown') return null;
                  var n = Number(e.state);
                  return isNaN(n) ? null : n;
                }
                function uno(v, u) {
                  return v === null ? '--' : (Math.round(v * 10) / 10).toFixed(1).replace('.', ',') + u;
                }
                var vm = num('sensor.centrale_termica_temperatura_mandata_pdc');
                var vr = num('sensor.centrale_termica_temperatura_ritorno_pdc');
                var vd = num('sensor.centrale_termica_delta_t_pdc');
                var vf = num('sensor.centrale_termica_flusso_pdc');
                var vp = num('sensor.centrale_termica_potenza_termica_pdc');
                var vw = num('sensor.consumo_attuale_pdc');
                var vc = num('sensor.pdc_cop');
                var st = states['binary_sensor.stato_pdc'];

                var scorre = (vf !== null && vf > 0.1);
                var accesa = !!(st && st.state === 'on');
                var cFlusso = scorre ? '#22c55e' : '#475569';
                var cSpia = cFlusso;
                var alone = scorre ? 'filter="drop-shadow(0 0 3px #22c55e)"' : '';
                var cPdc = accesa ? '#22c55e' : '#475569';
                var alonePdc = accesa ? 'filter="drop-shadow(0 0 2px #22c55e)"' : '';
                var statoPompa = scorre ? 'IN FUNZIONE' : 'FERMO';
                var statoPdc = accesa ? 'PDC ACCESA' : 'PDC SPENTA';
                var tMandata = uno(vm, '\u00b0');
                var tRitorno = uno(vr, '\u00b0');
                var tPortata = vf === null ? '--' : (Math.round(vf * 10) / 10).toFixed(1).replace('.', ',');
                var tDelta = '\u0394T ' + uno(vd, '\u00b0');

                var voci = [['Resa termica', uno(vp, ' kW'), vp ? '#FFB463' : '#8A93A0'],
                            ['Assorbimento', vw === null ? '--' : Math.round(vw) + ' W',
                             accesa ? '#EEF0F3' : '#8A93A0']];
                // In marcia il COP attuale; a riposo l'ultimo misurato (sensor.pdc_cop_ultimo,
                // che conserva il valore e l'ora), in grigio, invece di sparire.
                if (vc !== null) voci.push(['COP', uno(vc, ''), '#63E2A4']);
                else {
                  var ul = states['sensor.pdc_cop_ultimo'];
                  var vu = ul ? Number(ul.state) : NaN;
                  if (ul && !isNaN(vu)) {
                    var tu = new Date(ul.attributes.misurato), oggi = new Date();
                    var quando = isNaN(tu) ? '' : (tu.toDateString() === oggi.toDateString()
                      ? ('0' + tu.getHours()).slice(-2) + ':' + ('0' + tu.getMinutes()).slice(-2)
                      : tu.getDate() + '/' + (tu.getMonth() + 1));
                    voci.push(['COP ultimo' + (quando ? ' · ' + quando : ''), uno(vu, ''), '#8A93A0']);
                  }
                }
                var riga = '';
                for (var k = 0; k < voci.length; k++) {
                  riga += '<div style="flex:1;min-width:0;text-align:center;">'
                        + '<div style="font-size:12px;color:#8A93A0;">' + voci[k][0] + '</div>'
                        + '<div style="font-size:16px;font-weight:700;margin-top:3px;'
                        + 'color:' + voci[k][2] + ';">' + voci[k][1] + '</div></div>';
                }

                var disegno = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" style="display:block">
                  <defs>
                    <style>
                      /* Rotazione ventola principale */
                      @keyframes spinFan {
