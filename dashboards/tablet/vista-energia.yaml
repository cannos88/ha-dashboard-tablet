                  <circle cx="215" cy="210" r="24" fill="url(#chromeGrad)" stroke="#334155" stroke-width="1.5"/>
                  <ellipse cx="209" cy="204" rx="10" ry="6" fill="#ffffff" opacity="0.65" transform="rotate(-30 209 204)"/>

                  <!-- Badge Modello / Targhetta Inverter in alluminio spazzolato -->
                  <g transform="translate(260, 318)">
                    <rect x="0" y="0" width="105" height="26" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
                    <text x="8" y="13" fill="#0f172a" font-family="sans-serif" font-size="8" font-weight="900" letter-spacing="0.8">ECO-INVERTER</text>
                    <text x="8" y="21" fill="#475569" font-family="sans-serif" font-size="6.5" font-weight="600">R290 PRO • R-HYBRID</text>
                    <path d="M 88 7 L 96 13 L 88 19 Z" fill="#0284c7"/>
                  </g>

                  <!-- ================= SEZIONE LATERALE BLACK GLASS ================= -->
                  <!-- Cristallo lucido sfumato -->
                  <rect x="390" y="52" width="150" height="302" rx="4" fill="url(#glassGrad)" stroke="#334155" stroke-width="1.5"/>

                  <!-- Riflesso specchiato obliquo frontale -->
                  <path d="M 391 53 L 475 53 L 415 353 L 391 353 Z" fill="#ffffff" opacity="0.04"/>

                  <!-- Modulo Display 1: MANDATA (Flow) -->
                  <g transform="translate(405, 68)">
                    <rect x="0" y="0" width="120" height="52" rx="5" fill="#05070a" stroke="#1e293b" stroke-width="1.2"/>
                    <circle cx="14" cy="14" r="3.5" fill="#ef4444" opacity="0.9"/>
                    <text x="24" y="18" fill="#f87171" font-size="11.5" class="subtext">MANDATA</text>
                    <text id="t-flow" x="60" y="43" fill="#f87171" font-size="26" text-anchor="middle" class="led-glow-red">${tMandata}</text>
                  </g>

                  <!-- Modulo Display 2: RITORNO (Return) -->
                  <g transform="translate(405, 128)">
                    <rect x="0" y="0" width="120" height="52" rx="5" fill="#05070a" stroke="#1e293b" stroke-width="1.2"/>
                    <circle cx="14" cy="14" r="3.5" fill="#38bdf8" opacity="0.9"/>
                    <text x="24" y="18" fill="#38bdf8" font-size="11.5" class="subtext">RITORNO</text>
                    <text id="t-return" x="60" y="43" fill="#38bdf8" font-size="26" text-anchor="middle" class="led-glow-blue">${tRitorno}</text>
                  </g>

                  <!-- ================= SEZIONE CIRCOLATORE & PORTATA ================= -->
                  <!-- Riquadro Display Portata Circolatore (Flow Rate) -->
                  <g transform="translate(405, 188)">
                    <rect x="0" y="0" width="120" height="52" rx="5" fill="#05070a" stroke="#1e293b" stroke-width="1.2"/>
                    <!-- LED di stato circolatore (Verde) -->
                    <circle cx="14" cy="14" r="3.5" fill="${cSpia}" ${alone}/>
                    <text x="24" y="18" fill="${scorre ? '#86efac' : '#475569'}" font-size="11.5" class="subtext">PORTATA</text>

                    <!-- Valore Portata in L/min -->
                    <g transform="translate(60, 42)">
                      <text id="flow-rate" x="-12" y="1" fill="${scorre ? '#4ade80' : '#475569'}" font-size="26" text-anchor="middle" class="${scorre ? 'led-glow-green' : ''}">${tPortata}</text>
                      <text x="26" y="-4" fill="#86efac" font-size="12" font-family="sans-serif" font-weight="700">L/min</text>
                    </g>
                  </g>

                  <!-- Modulo Grafico Idraulico Animato: Icona Circolatore + Flusso Dinamico -->
                  <g transform="translate(405, 252)">
                    <!-- Piastra supporto modulo pompa -->
