                  card_mod: *macchina
      custom_fields:
        c: >
          [[[
            /* Mini elettrodomestico realistico (svg 40x40): animato solo se attivo. */
            var mini = function (ic, attivo, px) {
              var D = '<defs><linearGradient id="eSmalto" x1="0" y1="0" x2="1" y2=".8"><stop offset="0" stop-color="#ffffff"/>' +
                '<stop offset=".35" stop-color="#f1f5f9"/><stop offset=".8" stop-color="#d5dde8"/><stop offset="1" stop-color="#b6c2d1"/></linearGradient>' +
                '<linearGradient id="eCromo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/>' +
                '<stop offset=".35" stop-color="#94a3b8"/><stop offset=".6" stop-color="#e2e8f0"/><stop offset="1" stop-color="#64748b"/></linearGradient>' +
                '<radialGradient id="eAcqua" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#9DD2FF"/><stop offset="1" stop-color="#1E3A5F"/></radialGradient>' +
                '<radialGradient id="eCaldo" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFD0A0"/><stop offset="1" stop-color="#7A3B12"/></radialGradient>' +
                '<radialGradient id="eSpento" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#0f172a"/></radialGradient>' +
                '<linearGradient id="eVetro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#020617"/></linearGradient>' +
                '</defs><style>.eRuota{transform-origin:20px 23px;animation:eRuota 1.1s linear infinite}' +
                '.eSale{animation:eSale 2s ease-out infinite}.eSale2{animation:eSale 2s ease-out 1s infinite}' +
                '.eArde{animation:eArde 1.8s ease-in-out infinite}.eAria{stroke-dasharray:3 4;animation:eAria .8s linear infinite}' +
                '@keyframes eRuota{to{transform:rotate(360deg)}}@keyframes eSale{0%{transform:translateY(2px);opacity:0}40%{opacity:.8}100%{transform:translateY(-5px);opacity:0}}' +
                '@keyframes eArde{0%,100%{opacity:1}50%{opacity:.6}}@keyframes eAria{to{stroke-dashoffset:-14}}' +
                '@media (prefers-reduced-motion:reduce){.eRuota,.eSale,.eSale2,.eArde,.eAria{animation:none}}</style>';
              var led = function (x, y, c) { return '<circle cx="' + x + '" cy="' + y + '" r="1.4" fill="' + (attivo ? c : '#64748b') + '"' +
                (attivo ? ' style="filter:drop-shadow(0 0 1.5px ' + c + ')"' : '') + '/>'; };
              var a = '';
              if (ic === 'mdi:washing-machine' || ic === 'mdi:tumble-dryer') {
                var asc = ic === 'mdi:tumble-dryer';
                a = '<rect x="5" y="3" width="30" height="34" rx="4" fill="url(#eSmalto)" stroke="#94a3b8" stroke-width=".8"/>' +
                  '<rect x="5" y="3" width="30" height="7" rx="3" fill="#e2e8f0"/><rect x="8" y="5.5" width="9" height="2.4" rx="1" fill="#0f172a"/>' +
                  led(30, 6.7, asc ? '#FF9F5A' : '#5CB0FF') +
                  '<circle cx="20" cy="23" r="10.5" fill="url(#eCromo)"/><circle cx="20" cy="23" r="8" fill="url(#' +
                  (attivo ? (asc ? 'eCaldo' : 'eAcqua') : 'eSpento') + ')"/>' +
                  '<g' + (attivo ? ' class="eRuota"' : '') + ' stroke="#fff" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round" fill="none">' +
                  '<path d="M20 16.5v3.5M14.4 26.2l3-1.7M25.6 26.2l-3-1.7"/></g>' +
                  '<path d="M15 19a6 6 0 0 1 5-3" stroke="#fff" stroke-opacity=".5" stroke-width="1.2" fill="none" stroke-linecap="round"/>';
              } else if (ic === 'mdi:dishwasher') {
                a = (attivo ? '<g stroke="#CFE3F5" stroke-width="1.4" stroke-linecap="round" fill="none">' +
                    '<path class="eSale" d="M14 4q-2 -2 0 -4"/><path class="eSale2" d="M20 4q-2 -2 0 -4"/><path class="eSale" d="M26 4q-2 -2 0 -4"/></g>' : '') +
                  '<rect x="5" y="4" width="30" height="33" rx="4" fill="url(#eSmalto)" stroke="#94a3b8" stroke-width=".8"/>' +
                  '<rect x="5" y="4" width="30" height="8" rx="3" fill="#e2e8f0"/><rect x="13" y="13.5" width="14" height="2.2" rx="1.1" fill="url(#eCromo)"/>' +
                  '<rect x="8" y="6.6" width="11" height="2.6" rx="1" fill="#0f172a"/>' + led(30, 8, '#4FD1C5') +
                  '<path d="M8 19h24M8 27h24" stroke="#cbd5e1" stroke-width="1"/>';
              } else if (ic === 'mdi:stove') {
                var zona = function (x, y, r, on) {
                  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + (on ? 'rgba(255,90,40,.55)' : 'none') + '" stroke="' +
                    (on ? '#FF7A2F' : '#475569') + '" stroke-width="1.6"' + (on ? ' class="eArde" style="filter:drop-shadow(0 0 2.5px #FF7A2F)"' : '') + '/>';
                };
                a = '<rect x="2" y="7" width="36" height="27" rx="4" fill="url(#eVetro)" stroke="#475569" stroke-width=".8"/>' +
                  '<path d="M4 9h32" stroke="#fff" stroke-opacity=".12" stroke-width="1"/>' +
                  zona(12, 17, 5.5, attivo) + zona(28, 17, 4, false) + zona(12, 27.5, 3.6, false) + zona(28, 27.5, 4.6, attivo);
              } else {
                a = '<rect x="3" y="7" width="34" height="15" rx="6" fill="url(#eSmalto)" stroke="#94a3b8" stroke-width=".8"/>' +
                  '<rect x="7" y="17" width="26" height="3" rx="1.5" fill="#334155"/>' + led(31, 11, '#5CB0FF') +
                  '<g stroke="' + (attivo ? '#7CC4FF' : '#334155') + '" stroke-width="1.6" stroke-linecap="round" fill="none"' +
                  (attivo ? ' class="eAria"' : '') + '><path d="M11 25q-1 5 -4 9M20 25v10M29 25q1 5 4 9"/></g>';
              }
              return '<svg width="' + px + '" height="' + px + '" viewBox="0 0 40 40" style="display:block;' +
                (attivo ? '' : 'opacity:.55;') + '">' + D + a + '</svg>';
            };
            var riga = function (icona, nome, c, testo, w) {
              var r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16);
              return '<div style="display:flex;align-items:center;gap:12px;">' +
                '<div style="width:46px;height:46px;border-radius:14px;flex:none;display:grid;' +
                'place-items:center;background:rgba(' + r + ',' + g + ',' + b + ',.14);">' + mini(icona, true, 40) + '</div>' +
                '<div style="flex:1;min-width:0;"><div style="font-size:15px;font-weight:700;color:#EEF0F3;">' +
                nome + '</div><div style="font-size:13px;color:' + c + ';white-space:nowrap;overflow:hidden;' +
                'text-overflow:ellipsis;">' + testo + '</div></div>' + (isNaN(w) ? '' :
                '<span style="font-size:15px;font-weight:700;color:#EEF0F3;font-variant-numeric:tabular-nums;">' +
                Math.round(w) + ' W</span>') + '</div>';
            };
            var num = function (id) { var e = states[id]; return e ? Number(e.state) : NaN; };
            var durata = function (s) {
              // Dal passaggio a "In funzione": inizio_ciclo viene riscritto a meta' ciclo.
              var min = Math.max(0, Math.round((Date.now() - new Date(s.last_changed).getTime()) / 60000));
              return isNaN(min) ? '' : ' · ' + (min >= 60 ? Math.floor(min / 60) + ' h ' + (min % 60) + ' min' : min + ' min');
            };
            // Solo chi sta consumando adesso.
            var righe = [], fermi = [];
            [['lavatrice', 'Lavatrice', 'mdi:washing-machine', '#5CB0FF'],
             ['lavastoviglie', 'Lavastoviglie', 'mdi:dishwasher', '#4FD1C5'],
             ['asciugatrice', 'Asciugatrice', 'mdi:tumble-dryer', '#FF9F5A']].forEach(function (m) {
              var s = states['sensor.stato_' + m[0]];
              if (s && s.state === 'In funzione')
                righe.push(riga(m[2], m[1], m[3], 'In funzione' + durata(s), num('sensor.presa' + m[0] + '_power')));
              else fermi.push(m[2]);
            });
            var wi = num('sensor.consumopianoinduzione_power');
            if (wi > 30) righe.push(riga('mdi:stove', 'Piano induzione', '#FF7A2F', 'In uso', wi));
            else fermi.push('mdi:stove');
            var na = num('sensor.condizionatori_accesi');
            if (!(na > 0)) fermi.push('mdi:air-conditioner');
            if (na > 0) {
              var kc = num('sensor.consumo_giornaliero_condizionatori');
              righe.push(riga('mdi:fan', 'Condizionatori', '#5CB0FF',
                (na === 1 ? '1 acceso' : na + ' accesi') + (isNaN(kc) ? '' : ' · oggi ' +
                kc.toFixed(1).replace('.', ',') + ' kWh'), num('sensor.consumocondizionatori_power')));
            }
            // Attivi in alto; in fondo gli altri, spenti, per non lasciare una riga
            // sola sospesa a meta' tessera.
            if (righe.length) {
              var spenti = fermi.map(function (ic) { return '<div style="width:30px;height:30px;border-radius:10px;' +
                'display:grid;place-items:center;background:#1A2028;">' + mini(ic, false, 26) + '</div>'; }).join('');
              return '<div style="display:flex;flex-direction:column;gap:12px;height:100%;padding-top:6px;' +
                'box-sizing:border-box;text-align:left;">' + righe.join('') +
                (fermi.length ? '<div style="margin-top:auto;display:flex;align-items:center;gap:6px;' +
                  'padding-top:10px;border-top:1px solid #1C222A;"><span style="font-size:13px;color:#8A93A0;' +
                  'margin-right:4px;">Fermi</span>' + spenti + '</div>' : '') + '</div>';
            }
            // Nessuno consuma: avviso, la tessera resta toccabile per i dettagli.
            var icone = ['mdi:washing-machine', 'mdi:dishwasher', 'mdi:tumble-dryer', 'mdi:stove', 'mdi:air-conditioner']
              .map(function (ic) { return '<div style="width:38px;height:38px;border-radius:13px;display:grid;' +
                'place-items:center;background:#1A2028;">' + mini(ic, false, 32) + '</div>'; }).join('');
            return '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;' +
              'gap:12px;height:100%;"><div style="display:flex;gap:8px;">' + icone + '</div>' +
              '<div style="font-size:15px;font-weight:700;color:#EEF0F3;">Nessun elettrodomestico in funzione</div>' +
              '<div style="font-size:13px;color:#8A93A0;">tocca per vederli tutti</div></div>';
          ]]]

