                    <path d="M 215 210 C 160 230 120 250 97 208" stroke="#64748b" stroke-width="1" fill="none" opacity="0.6"/>
                  </g>

                  <!-- Griglia di protezione anteriore in acciaio cromato -->
                  <g fill="none" stroke="url(#chromeGrad)" stroke-linecap="round" opacity="0.95">
                    <circle cx="215" cy="210" r="38" stroke-width="2.8"/>
                    <circle cx="215" cy="210" r="62" stroke-width="2.8"/>
