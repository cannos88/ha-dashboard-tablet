    - type: custom:button-card
      template: sezione
      variables: {titolo: Sicurezza}
    # Allarme stretto, telecamere larghe: un grid card non sa fare colonne
    # diverse, layout-card si'.
    - type: custom:layout-card
      layout_type: custom:grid-layout
      layout:
        grid-template-columns: 1fr 2fr
        grid-gap: 12px
        margin: 0
        padding: 0
      cards:
        # ---------------- ALLARME ----------------
        # Solo lettura: l'inserimento resta all'app e alle automazioni.
        - type: custom:button-card
          template: tessera
          entity: alarm_control_panel.allarme_allarme_area_1
          styles:
            card:
              - height: 150px
          triggers_update:
            - alarm_control_panel.allarme_allarme_area_2
          custom_fields:
            c: >
              [[[
                var aree = [['Area 1', 'alarm_control_panel.allarme_allarme_area_1'],
                            ['Area 2', 'alarm_control_panel.allarme_allarme_area_2']];
                var NOMI = {disarmed: 'spenta', armed_away: 'inserita', armed_home: 'in casa',
                            armed_night: 'notte', pending: 'in attesa', arming: 'in inserimento',
                            triggered: 'IN ALLARME'};
                var armate = 0, scattato = false, righe = '';
                for (var i = 0; i < aree.length; i++) {
                  var a = states[aree[i][1]];
                  var st = a ? a.state : 'unavailable';
                  if (st === 'triggered') scattato = true;
                  if (st !== 'disarmed' && st !== 'unavailable' && st !== 'unknown') armate++;
                  righe += '<div style="display:flex;justify-content:space-between;font-size:14px;">' +
                    '<span style="color:#8A93A0;">' + aree[i][0] + '</span><span style="font-weight:700;' +
                    'color:' + (st === 'disarmed' ? '#8A93A0' : (st === 'triggered' ? '#FF8A80' : '#6FD39B')) +
                    ';">' + (NOMI[st] || 'non raggiungibile') + '</span></div>';
                }
                var col = scattato ? '#FF8A80' : (armate === 0 ? '#8A93A0' : '#6FD39B');
                var titolo = scattato ? 'Allarme scattato' : (armate === 0 ? 'Allarme spento'
                  : (armate === aree.length ? 'Allarme inserito' : 'Allarme parziale'));
                /* Tastiera dell'allarme realistica: smalto, display scuro, tasti, LED nel colore di
                   stato; quando scatta il lampeggiante rosso in cima pulsa. */
                var tasti = '';
                for (var ty = 0; ty < 3; ty++) for (var tx = 0; tx < 3; tx++)
                  tasti += '<rect x="' + (14 + tx * 9) + '" y="' + (32 + ty * 7) + '" width="7" height="5" rx="1.2" fill="url(#alTasto)"/>';
                var scudo = '<svg width="56" height="64" viewBox="0 0 52 60" style="flex:none;">' +
                  '<defs><linearGradient id="alSmalto" x1="0" y1="0" x2="1" y2=".8"><stop offset="0" stop-color="#ffffff"/>' +
                  '<stop offset=".35" stop-color="#f1f5f9"/><stop offset=".8" stop-color="#d5dde8"/><stop offset="1" stop-color="#b6c2d1"/></linearGradient>' +
                  '<linearGradient id="alVetro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#020617"/></linearGradient>' +
                  '<linearGradient id="alTasto" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>' +
                  '<radialGradient id="alLampo" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#FFD0CC"/><stop offset="1" stop-color="#DC2626"/></radialGradient>' +
                  '</defs><style>.alLampeggia{animation:alLampeggia .7s ease-in-out infinite}' +
                  '@keyframes alLampeggia{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.alLampeggia{animation:none}}</style>' +
                  (scattato ? '<path class="alLampeggia" d="M18 8a8 8 0 0 1 16 0z" fill="url(#alLampo)" style="filter:drop-shadow(0 0 5px #FF5A4F)"/>' : '') +
                  '<rect x="8" y="8" width="36" height="50" rx="6" fill="url(#alSmalto)" stroke="#94a3b8" stroke-width="1" ' +
                  'style="filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))"/>' +
                  '<rect x="13" y="13" width="26" height="14" rx="2.5" fill="url(#alVetro)"/>' +
                  '<rect x="16" y="18.5" width="' + (scattato ? 20 : (armate ? 14 : 8)) + '" height="3" rx="1" fill="' + col + '"' +
                  (armate || scattato ? ' style="filter:drop-shadow(0 0 2px ' + col + ')"' : ' opacity=".7"') + '/>' + tasti +
                  '<circle cx="40" cy="53" r="1.8" fill="' + col + '"' + (armate || scattato ? ' style="filter:drop-shadow(0 0 3px ' + col + ')"' : '') + '/></svg>';
                return '<div style="display:flex;flex-direction:column;justify-content:space-between;' +
                  'height:100%;text-align:left;"><div style="display:flex;align-items:center;gap:14px;">' +
                  scudo + '<div style="font-size:18px;font-weight:700;color:' +
                  (armate || scattato ? col : '#EEF0F3') + ';">' + titolo + '</div></div>' +
                  '<div style="display:flex;flex-direction:column;gap:8px;">' + righe + '</div></div>';
              ]]]
        # ---------------- TELECAMERE ----------------
        # Al tocco la diretta nel popup (webrtc-camera sui flussi go2rtc, gli stessi
