        colore: '#F5B53D'
        apre: true
        luci:
        - light.luci_salotto
        - light.shellyplus1_80646fc7eaec_switch_0
        - light.luce_tavolo_salotto
        - light.led_salotto
        - light.led_divano_2
        - light.led_tv_salotto
        media:
