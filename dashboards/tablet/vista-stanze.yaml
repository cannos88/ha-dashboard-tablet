            size: wide
            style: '--popup-background-color: #0E1116; --popup-border-radius: 28px; --mdc-theme-surface: #0E1116; --primary-background-color: #0E1116; --ha-font-family-body: ''Plus Jakarta Sans'', system-ui, sans-serif; --mdc-typography-font-family: ''Plus Jakarta Sans'', system-ui, sans-serif; --mdc-typography-headline6-font-family: ''Plus Jakarta Sans'', system-ui, sans-serif; --mdc-typography-headline6-font-weight: 800; --ha-font-weight-medium: 800; font-family: ''Plus Jakarta Sans'', system-ui, sans-serif;'
            content: !include 'popup-salotto.yaml'
      variables:
