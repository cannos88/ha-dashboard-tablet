# ===========================================================================
# VISTA "Stanze" - dashboard Tablet
# GENERATO da genera-stanze.py: non modificare qui, cambia la tabella STANZE
# nello script e rilancialo.
#
# Undici stanze in quattro colonne sotto un'intestazione che fa da riepilogo.
# I parametri della tessera (luci, clima, sonde, alim/alimDa) sono gli stessi
# della dashboard Mobile. Al tocco si apre il popup della stanza (browser_mod),
# costruito con i template del tablet.
# ===========================================================================
- !include 'rail.yaml'
- !include 'testata.yaml'
- type: vertical-stack
  view_layout:
    grid-column: 3 / span 12
    grid-row: 3
  cards:
  - type: custom:button-card
    template: sezione
    entity: sensor.luci_accese
    triggers_update:
    - climate.condizionatore_salotto
    - climate.condizionatore_luca
    - climate.condizionatore_sofia
    - climate.condizionatore_matrimoniale
    - climate.condizionatore_sottotetto
    variables:
      titolo: Tutta la casa
      nota: |-
        [[[
          var C = ['climate.condizionatore_luca', 'climate.condizionatore_sofia',
                   'climate.condizionatore_matrimoniale', 'climate.condizionatore_salotto',
                   'climate.condizionatore_sottotetto'];
          var a = 0;
          for (var i = 0; i < C.length; i++) {
            var s = states[C[i]];
            if (s && ['off', 'unavailable', 'unknown'].indexOf(s.state) < 0) a++;
          }
          var n = entity ? Number(entity.state) : 0;
          if (isNaN(n)) n = 0;
          return (n === 0 ? 'nessuna luce accesa' : (n === 1 ? '1 luce accesa' : n + ' luci accese')) +
            ' \u00B7 ' + (a === 0 ? 'nessun clima acceso' : (a === 1 ? '1 clima acceso' : a + ' climi accesi'));
        ]]]
  - type: grid
    columns: 4
    square: false
    cards:
    - type: custom:button-card
      template: stanza_tablet
      entity: light.luci_interne_cucina
      triggers_update:
      - light.luci_tavolo_cucina
      - media_player.cucina_2
      - sensor.aqaracucina_temperature
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            title: Cucina
            size: wide
            style: '--popup-background-color: #0E1116; --popup-border-radius: 28px; --mdc-theme-surface: #0E1116; --primary-background-color: #0E1116; --ha-font-family-body: ''Plus Jakarta Sans'', system-ui, sans-serif; --mdc-typography-font-family: ''Plus Jakarta Sans'', system-ui, sans-serif; --mdc-typography-headline6-font-family: ''Plus Jakarta Sans'', system-ui, sans-serif; --mdc-typography-headline6-font-weight: 800; --ha-font-weight-medium: 800; font-family: ''Plus Jakarta Sans'', system-ui, sans-serif;'
            content: !include 'popup-cucina.yaml'
      variables:
        nome: Cucina
        icona: <path d="M4 4h16v6H4zM7 14v6M12 14v6M17 14v6"/>
        colore: '#FF9F5A'
        apre: true
        luci:
        - light.luci_interne_cucina
        - light.luci_tavolo_cucina
        media:
        - media_player.cucina_2
        sonde:
        - sensor.aqaracucina_temperature
    - type: custom:button-card
      template: stanza_tablet
      entity: climate.condizionatore_salotto
      triggers_update:
      - light.luci_salotto
      - light.shellyplus1_80646fc7eaec_switch_0
      - light.luce_tavolo_salotto
      - light.led_salotto
      - light.led_divano_2
      - light.led_tv_salotto
      - media_player.salotto_2
      - sensor.aqarasalotto_temperature
      - sensor.netatmo_salotto_temperature
