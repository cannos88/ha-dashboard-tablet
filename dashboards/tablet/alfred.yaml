# ===========================================================================
# ALFRED - robot aspirapolvere e lavapavimenti (Roborock Q Revo, vacuum.roborock_q_revo)
# Incluso in fondo alla vista Stanze da genera-stanze.py (7/10/2026).
# A sinistra robot e base disegnati come la pompa di calore (smalto, LED, ombre):
# in pulizia gira la spazzola laterale, in carica pulsa il LED della base, i due
# serbatoi della base mostrano acqua pulita e sporca. Al centro stato, batteria,
# stanza, modalita' e ultima pulizia; a destra sei comandi. Il disegno apre il
# popup con mappa, impostazioni, base e manutenzione (popup-alfred.yaml).
# Nelle entita' il nome e' "Alfed": qui si scrive Alfred.
# ===========================================================================
type: vertical-stack
cards:
  - type: custom:button-card
    template: sezione
    entity: vacuum.roborock_q_revo
    variables:
      titolo: Alfred
      nota: '[[[ return "aspira e lava i pavimenti · tocca il robot per mappa e impostazioni"; ]]]'
  - type: custom:button-card
    template: tessera
    entity: vacuum.roborock_q_revo
    triggers_update:
      - sensor.alfed_stato
      - sensor.alfed_batteria
      - sensor.alfed_current_room
      - sensor.alfed_avanzamento_della_pulizia
      - sensor.alfed_errore_aspirapolvere
      - sensor.alfed_errore_nella_base
      - binary_sensor.roborock_q_revo_mancanza_d_acqua
      - select.lavanderia_alfed_cleaning_mode
      - select.alfed_mappa_selezionata
    styles:
      card:
        - height: 160px
        - padding: 10px 16px
      grid:
        - grid-template-areas: '"c b1 b2 b3" "c b4 b5 b6"'
        - grid-template-columns: 1fr 138px 138px 138px
        - grid-template-rows: 1fr 1fr
        - gap: 10px
    custom_fields:
      c: >
        [[[
          var v = entity, st = states['sensor.alfed_stato'];
          var giu = !v || v.state === 'unavailable' || v.state === 'unknown';
          var num = function (id) { var e = states[id]; return e && !isNaN(Number(e.state)) ? Number(e.state) : null; };
          var bat = num('sensor.alfed_batteria');
          var err = states['sensor.alfed_errore_aspirapolvere'], errB = states['sensor.alfed_errore_nella_base'];
          var guasto = !giu && ((err && err.state !== 'none' && err.state !== 'unknown') ||
                                (errB && errB.state !== 'ok' && errB.state !== 'unknown') || v.state === 'error');
          var secca = states['binary_sensor.roborock_q_revo_mancanza_d_acqua'];
          var senzaAcqua = (secca && secca.state === 'on') || (errB && errB.state === 'water_empty');
          var sporcaPiena = errB && errB.state === 'waste_water_tank_full';
          var pulisce = !giu && ['cleaning', 'returning'].indexOf(v.state) >= 0;
          var inBase = !giu && v.state === 'docked';
          var FRASI = {charging: 'In carica', charging_complete: 'Carico, alla base', idle: 'Fermo', cleaning: 'Sta pulendo',
            segment_cleaning: 'Pulisce le stanze', zoned_cleaning: 'Pulisce una zona', spot_cleaning: 'Pulizia localizzata',
            returning_home: 'Torna alla base', docking: 'Rientra nella base', paused: 'In pausa', error: 'Errore',
            washing_the_mop: 'Lava il mocio', going_to_wash_the_mop: 'Va a lavare il mocio', emptying_the_bin: 'Svuota la polvere',
            mapping: 'Crea la mappa', going_to_target: 'Va al punto scelto', air_drying_stopping: 'Asciuga il mocio',
            segment_mopping: 'Lava le stanze', robot_status_mopping: 'Lava i pavimenti', updating: 'Si aggiorna',
            device_offline: 'Non raggiungibile'};
          var stato = giu ? 'Non raggiungibile' : (FRASI[st && st.state] || ({docked: 'Alla base', cleaning: 'Sta pulendo',
            returning: 'Torna alla base', paused: 'In pausa', idle: 'Fermo', error: 'Errore'})[v.state] || v.state);
          var ERR = {lidar_blocked: 'laser bloccato', bumper_stuck: 'paraurti bloccato', wheels_suspended: 'ruote sollevate',
            main_brush_jammed: 'spazzola principale bloccata', side_brush_jammed: 'spazzola laterale bloccata',
            robot_trapped: 'robot bloccato', no_dustbin: 'manca il contenitore', low_battery: 'batteria scarica',
            robot_tilted: 'robot inclinato', filter_blocked: 'filtro ostruito', return_to_dock_fail: 'non trova la base',
            water_empty: "manca l'acqua pulita", waste_water_tank_full: 'serbatoio acqua sporca pieno',
            duct_blockage: 'condotto ostruito', dirty_tank_latch_open: 'serbatoio sporco aperto',
            cleaning_tank_full_or_blocked: 'vaschetta di lavaggio piena'};
          if (guasto) stato = 'Problema: ' + (ERR[err && err.state !== 'none' ? err.state : errB.state] ||
            (err && err.state !== 'none' ? err.state : errB.state).replace(/_/g, ' '));
          var colStato = giu ? '#8A93A0' : (guasto ? '#FF8A80' : (pulisce ? '#5CC8FF' : (inBase ? '#6FD39B' : '#EEF0F3')));
          var MODI = {vacuum: 'Solo aspira', vac_and_mop: 'Aspira e lava', mop: 'Solo lava', custom: 'Personalizzata'};
          var POT = {quiet: 'silenziosa', balanced: 'bilanciata', turbo: 'turbo', max: 'massima', max_plus: 'massima+', off: 'spenta', custom: 'personalizzata'};
          var modo = states['select.lavanderia_alfed_cleaning_mode'];
          var mappa = states['select.alfed_mappa_selezionata'];
          var stanza = states['sensor.alfed_current_room'];
          var avanz = num('sensor.alfed_avanzamento_della_pulizia'), area = num('sensor.alfed_area_di_pulizia');
          var fine = states['sensor.alfed_fine_dell_ultima_pulizia'];
          var quando = function (iso) { var d = new Date(iso); if (isNaN(d)) return '';
            var oggi = new Date(), ieri = new Date(); ieri.setDate(oggi.getDate() - 1);
            var hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
            if (d.toDateString() === oggi.toDateString()) return 'oggi ' + hm;
            if (d.toDateString() === ieri.toDateString()) return 'ieri ' + hm;
            return d.getDate() + '/' + (d.getMonth() + 1) + ' ' + hm; };
          var riga1 = (bat === null ? '' : 'Batteria ' + Math.round(bat) + '%') +
            (stanza && stanza.state && stanza.state !== 'unknown' ? ' · ' + stanza.state : '') +
            (mappa ? ' · ' + mappa.state.trim().toLowerCase() : '');
          var riga2 = (modo ? (MODI[modo.state] || modo.state) : '') + (v && v.attributes.fan_speed ? ' · potenza ' +
            (POT[v.attributes.fan_speed] || v.attributes.fan_speed) : '');
          var riga3 = pulisce ? 'Avanzamento ' + (avanz === null ? '--' : Math.round(avanz) + '%') +
            (area === null ? '' : ' · ' + area.toFixed(0) + ' m²')
            : (fine && fine.state && fine.state !== 'unknown' ? 'Ultima pulizia ' + quando(fine.state) +
              (area === null ? '' : ' · ' + area.toFixed(0) + ' m²') : '');

          /* ---- disegno: base a destra, robot davanti (in base) o a sinistra (al lavoro) ---- */
          var rx = inBase ? 118 : 70, led = guasto ? '#FF5A4F' : (inBase ? '#6FD39B' : (pulisce ? '#5CC8FF' : '#8A93A0'));
          var livPulita = senzaAcqua ? 8 : 30, livSporca = sporcaPiena ? 30 : 9;
          var spazzola = '<g class="alSpazzola" style="transform-origin:' + (rx - 34) + 'px 104px">' +
            '<path d="M' + (rx - 34) + ' 104 l-11 -3 M' + (rx - 34) + ' 104 l9 -7 M' + (rx - 34) + ' 104 l2 11" ' +
            'stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/></g>';
          var robot = '<g>' +
            '<ellipse cx="' + rx + '" cy="114" rx="52" ry="12" fill="#000" opacity=".45"/>' +
            '<ellipse cx="' + rx + '" cy="104" rx="50" ry="19" fill="url(#alFianco)"/>' +
            '<rect x="' + (rx - 50) + '" y="94" width="100" height="10" fill="url(#alFianco)"/>' +
            '<ellipse cx="' + rx + '" cy="94" rx="50" ry="19" fill="url(#alSmalto)" stroke="#94a3b8" stroke-width="1"/>' +
            '<path d="M' + (rx - 48) + ' 98 A50 19 0 0 0 ' + (rx + 48) + ' 98" fill="none" stroke="#334155" stroke-width="3" opacity=".55"/>' +
            '<ellipse cx="' + (rx + 6) + '" cy="88" rx="15" ry="6" fill="#334155"/>' +
            '<rect x="' + (rx - 9) + '" y="80" width="30" height="8" fill="#1e293b"/>' +
            '<ellipse cx="' + (rx + 6) + '" cy="80" rx="15" ry="6" fill="url(#alCromo)"/>' +
            '<circle cx="' + (rx - 22) + '" cy="92" r="2.6" fill="' + led + '" style="filter:drop-shadow(0 0 3px ' + led + ')"/>' +
            spazzola + '</g>';
          var base = '<g style="filter:drop-shadow(0 6px 5px rgba(0,0,0,.5))">' +
            '<path d="M150 118 L250 118 L242 128 L158 128 Z" fill="#334155"/>' +
            '<rect x="160" y="10" width="82" height="110" rx="10" fill="url(#alSmalto)" stroke="#94a3b8" stroke-width="1"/></g>' +
            '<rect x="166" y="16" width="33" height="44" rx="5" fill="#0f172a"/><rect x="203" y="16" width="33" height="44" rx="5" fill="#0f172a"/>' +
            '<rect x="168" y="' + (58 - livPulita) + '" width="29" height="' + livPulita + '" rx="3" fill="' + (senzaAcqua ? '#FF8A80' : 'url(#alPulita)') + '"/>' +
            '<rect x="205" y="' + (58 - livSporca) + '" width="29" height="' + livSporca + '" rx="3" fill="' + (sporcaPiena ? '#FF8A80' : '#7A6A55') + '"/>' +
            '<rect x="166" y="16" width="70" height="8" rx="4" fill="#fff" opacity=".10"/>' +
            '<rect x="186" y="70" width="30" height="5" rx="2.5" fill="#1e293b"/>' +
            '<circle class="' + (inBase && !guasto ? 'alCarica' : '') + '" cx="201" cy="88" r="4" fill="' + led + '" style="filter:drop-shadow(0 0 4px ' + led + ')"/>';
          var scia = pulisce ? '<path class="alScia" d="M10 120 Q 60 136 120 122 T 160 126" fill="none" stroke="#5CC8FF" stroke-width="2" ' +
            'stroke-linecap="round" stroke-dasharray="3 7" opacity=".7"/>' : '';
          var svg = '<svg viewBox="0 0 250 140" style="width:250px;height:140px;flex:none;display:block;">' +
            '<defs><linearGradient id="alSmalto" x1="0" y1="0" x2="1" y2=".8"><stop offset="0" stop-color="#ffffff"/>' +
            '<stop offset=".35" stop-color="#f1f5f9"/><stop offset=".8" stop-color="#d5dde8"/><stop offset="1" stop-color="#b6c2d1"/></linearGradient>' +
            '<linearGradient id="alFianco" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#1e293b"/></linearGradient>' +
            '<linearGradient id="alCromo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset=".4" stop-color="#94a3b8"/>' +
            '<stop offset="1" stop-color="#475569"/></linearGradient>' +
            '<linearGradient id="alPulita" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9DD2FF"/><stop offset="1" stop-color="#2F86E0"/></linearGradient></defs>' +
            '<style>.alSpazzola{' + (pulisce ? 'animation:alGira .5s linear infinite' : '') + '}' +
            '.alCarica{animation:alPulsa 1.8s ease-in-out infinite}.alScia{animation:alScorre 1.2s linear infinite}' +
            '@keyframes alGira{to{transform:rotate(360deg)}}@keyframes alPulsa{50%{opacity:.3}}@keyframes alScorre{to{stroke-dashoffset:-20}}' +
            '@media (prefers-reduced-motion:reduce){.alSpazzola,.alCarica,.alScia{animation:none!important}}</style>' +
            scia + base + robot + '</svg>';
          return '<div style="display:flex;align-items:center;gap:16px;height:100%;text-align:left;">' + svg +
            '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;">' +
            '<div style="font-size:19px;font-weight:800;color:' + colStato + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + stato + '</div>' +
            '<div style="font-size:14px;color:#C3CAD3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + riga1 + '</div>' +
            '<div style="font-size:13.5px;color:#8A93A0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + riga2 + '</div>' +
            '<div style="font-size:13.5px;color:#8A93A0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + riga3 + '</div>' +
            '</div></div>';
        ]]]
      b1:
        card:
          type: custom:button-card
          template: pulsante
          entity: vacuum.roborock_q_revo
          variables:
            nome: '[[[ return entity && entity.state === "cleaning" ? "Pausa" : "Avvia"; ]]]'
            icona: '[[[ return entity && entity.state === "cleaning" ? "mdi:pause" : "mdi:play"; ]]]'
            colore: '#5CC8FF'
            attivo: true
          tap_action:
            action: call-service
            service: '[[[ return entity && entity.state === "cleaning" ? "vacuum.pause" : "vacuum.start"; ]]]'
            target: {entity_id: vacuum.roborock_q_revo}
      b2:
        card:
          type: custom:button-card
          template: pulsante
          variables: {nome: Alla base, icona: 'mdi:home-import-outline', colore: '#6FD39B'}
          tap_action:
            action: call-service
            service: vacuum.return_to_base
            target: {entity_id: vacuum.roborock_q_revo}
      b3:
        card:
          type: custom:button-card
          template: pulsante
          variables: {nome: Dopo i pasti, icona: 'mdi:silverware-fork-knife', colore: '#F5B53D'}
          tap_action:
            action: call-service
            service: button.press
            target: {entity_id: button.alfed_dopo_i_pasti}
            confirmation: {text: 'Avviare la pulizia "Dopo i pasti"?'}
      b4:
        card:
          type: custom:button-card
          template: pulsante
          variables: {nome: Piano terra, icona: 'mdi:home-floor-0', colore: '#8B9CFF'}
          tap_action:
            action: call-service
            service: script.turn_on
            target: {entity_id: script.pulisci_piano_terra}
            confirmation: {text: 'Pulire tutto il piano terra?'}
      b5:
        card:
          type: custom:button-card
          template: pulsante
          variables: {nome: Cucina, icona: 'mdi:countertop-outline', colore: '#8B9CFF'}
          tap_action:
            action: call-service
            service: script.turn_on
            target: {entity_id: script.pulisci_cucina}
            confirmation: {text: 'Pulire la cucina?'}
      b6:
        card:
          type: custom:button-card
          template: pulsante
          variables: {nome: Profonda, icona: 'mdi:broom', colore: '#8B9CFF'}
          tap_action:
            action: call-service
            service: button.press
            target: {entity_id: button.alfed_profonda}
            confirmation: {text: 'Avviare la pulizia profonda?'}
    tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          style: "--popup-background-color: #0E1116; --popup-border-radius: 28px; --mdc-theme-surface: #0E1116; --primary-background-color: #0E1116; --ha-font-family-body: 'Plus Jakarta Sans', system-ui, sans-serif; --mdc-typography-font-family: 'Plus Jakarta Sans', system-ui, sans-serif; --mdc-typography-headline6-font-family: 'Plus Jakarta Sans', system-ui, sans-serif; --mdc-typography-headline6-font-weight: 800; --ha-font-weight-medium: 800; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;"
          title: Alfred
          size: wide
          content: !include popup-alfred.yaml
