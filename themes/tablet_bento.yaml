# Tema "tablet_bento" - dashboard Tablet, redesign del 5 ottobre 2026.
# Tessere piatte su fondo quasi nero, niente ombre neumorfiche: la gerarchia
# la fanno il colore di riempimento delle tessere accese e la tipografia.
tablet_bento:
  background-color: "#0A0C0F"
  primary-background-color: "#0A0C0F"
  secondary-background-color: "#12161B"
  card-background-color: "#12161B"
  ha-card-background: "#12161B"
  divider-color: "#1C222A"
  ha-card-border-width: "0px"
  ha-card-border-radius: "24px"
  ha-card-box-shadow: "none"
  primary-text-color: "#EEF0F3"
  secondary-text-color: "#8A93A0"
  text-primary-color: "#EEF0F3"
  disabled-text-color: "#5B6470"
  accent-color: "#F5B53D"
  state-active-color: "#F5B53D"
  state-icon-color: "#8A93A0"
  paper-item-icon-active-color: "#F5B53D"
  state-climate-cool-color: "#5CB0FF"
  state-climate-heat-color: "#FF9F5A"
  primary-font-family: "'Plus Jakarta Sans', system-ui, sans-serif"
  paper-font-common-base_-_font-family: "'Plus Jakarta Sans', system-ui, sans-serif"
  mdc-typography-font-family: "'Plus Jakarta Sans', system-ui, sans-serif"
  ha-font-family-body: "'Plus Jakarta Sans', system-ui, sans-serif"
  ha-font-family-heading: "'Plus Jakarta Sans', system-ui, sans-serif"
  scrollbar-thumb-color: "transparent"
  grid-card-gap: "12px"
  vertical-stack-card-gap: "12px"
  horizontal-stack-card-gap: "12px"
  # Campi di testo (ha-input su Web Awesome, HA 2026): senza queste il fondo
  # del campo resta bianco con il testo chiaro sopra.
  ha-color-form-background: "#1A2028"
  ha-color-form-background-hover: "#202833"
  ha-color-border-neutral-quiet: "#2A323D"
  ha-color-border-neutral-normal: "#3A434F"
  ha-color-border-neutral-loud: "#5B6470"
